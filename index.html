<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Absensi Acara</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background: #f5f6f8;

      color: #222;
    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: 0 auto;

    }


    .card {

      background: white;

      border-radius: 18px;

      padding: 24px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.08);

    }


    h1 {

      text-align: center;

      margin:
        0 0 8px 0;

      font-size: 27px;

    }


    .subtitle {

      text-align: center;

      color: #777;

      margin-bottom: 25px;

    }


    /* =====================================
       SEARCH
    ===================================== */

    .search-label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    #searchInput {

      width: 100%;

      padding: 14px 15px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

    }


    #searchInput:focus {

      border-color: #555;

    }


    /* =====================================
       JUMLAH PESERTA
    ===================================== */

    .participant-count {

      margin-top: 10px;

      margin-bottom: 10px;

      font-size: 13px;

      color: #777;

    }


    /* =====================================
       LIST PESERTA
    ===================================== */

    #participantList {

      max-height: 400px;

      overflow-y: auto;

      margin-bottom: 20px;

    }


    .participant {

      padding: 15px;

      border:
        1px solid #e4e4e4;

      border-radius: 10px;

      margin-bottom: 8px;

      cursor: pointer;

      background: white;

      transition:
        background 0.15s,
        transform 0.1s;

    }


    .participant:hover {

      background: #f5f5f5;

    }


    .participant:active {

      transform: scale(0.99);

    }


    .participant-name {

      font-size: 16px;

      font-weight: bold;

    }


    .participant-status {

      margin-top: 5px;

      font-size: 13px;

      color: #777;

    }


    .participant.disabled {

      background: #f7f7f7;

      opacity: 0.55;

      cursor: not-allowed;

    }


    .participant.disabled:hover {

      background: #f7f7f7;

    }


    /* =====================================
       SELECTED
    ===================================== */

    #selectedBox {

      display: none;

      padding: 15px;

      background: #f1f1f1;

      border-radius: 10px;

      margin-bottom: 20px;

    }


    #selectedBox strong {

      display: block;

      margin-bottom: 5px;

    }


    #selectedName {

      font-size: 17px;

      font-weight: bold;

    }


    /* =====================================
       CAMERA
    ===================================== */

    #cameraSection {

      display: none;

      margin-top: 10px;

    }


    .camera-label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    #video {

      width: 100%;

      display: block;

      background: #000;

      border-radius: 12px;

    }


    #preview {

      width: 100%;

      display: none;

      margin-top: 10px;

      border-radius: 12px;

    }


    #canvas {

      display: none;

    }


    /* =====================================
       BUTTON
    ===================================== */

    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;

    }


    #takePhotoBtn {

      background: #333;

      color: white;

    }


    #submitBtn {

      background: #111;

      color: white;

    }


    #resetBtn {

      background: #e9e9e9;

      color: #222;

      margin-top: 15px;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    /* =====================================
       MESSAGE
    ===================================== */

    #message {

      display: none;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      margin-top: 15px;

      font-size: 14px;

    }


    .success {

      display: block !important;

      background: #e8f5e9;

      color: #2e7d32;

    }


    .error {

      display: block !important;

      background: #ffebee;

      color: #c62828;

    }


    /* =====================================
       LOADING
    ===================================== */

    .loading {

      text-align: center;

      color: #777;

      padding: 20px;

    }


    .empty {

      text-align: center;

      color: #888;

      padding: 20px;

    }


  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <h1>
      Absensi Acara
    </h1>


    <div class="subtitle">
      Pilih nama dan ambil foto
    </div>


    <!-- ================================= -->
    <!-- SEARCH -->
    <!-- ================================= -->

    <label
      class="search-label"
      for="searchInput"
    >
      Cari Nama Peserta
    </label>


    <input
      type="text"
      id="searchInput"
      placeholder="Ketik nama jika ingin mencari..."
      autocomplete="off"
    >


    <div
      id="participantCount"
      class="participant-count"
    >
      Memuat peserta...
    </div>


    <!-- ================================= -->
    <!-- PARTICIPANT LIST -->
    <!-- ================================= -->

    <div id="participantList">

      <div class="loading">
        Memuat daftar nama...
      </div>

    </div>


    <!-- ================================= -->
    <!-- SELECTED PARTICIPANT -->
    <!-- ================================= -->

    <div id="selectedBox">

      <strong>
        Nama terpilih:
      </strong>

      <span id="selectedName"></span>

    </div>


    <!-- ================================= -->
    <!-- CAMERA -->
    <!-- ================================= -->

    <div id="cameraSection">

      <label class="camera-label">
        Foto Kehadiran
      </label>


      <video
        id="video"
        autoplay
        playsinline
      ></video>


      <canvas
        id="canvas"
      ></canvas>


      <img
        id="preview"
        alt="Preview foto"
      >


      <button
        id="takePhotoBtn"
        onclick="ambilFoto()"
      >
        📷 Ambil Foto
      </button>


      <button
        id="submitBtn"
        onclick="submitAbsensi()"
        disabled
      >
        ✓ Absen
      </button>

    </div>


    <!-- ================================= -->
    <!-- MESSAGE -->
    <!-- ================================= -->

    <div
      id="message"
    ></div>


    <!-- ================================= -->
    <!-- RESET -->
    <!-- ================================= -->

    <button
      id="resetBtn"
      onclick="resetForm()"
    >
      Pilih Nama Lain
    </button>


  </div>

</div>


<script>


  // =================================================
  // URL APPS SCRIPT
  // =================================================

  const APPS_SCRIPT_URL =
    "GANTI_DENGAN_URL_APPS_SCRIPT";


  // =================================================
  // VARIABLE
  // =================================================

  let pesertaList = [];

  let pesertaTerpilih = null;

  let streamCamera = null;

  let fotoBase64 = null;


  // =================================================
  // LOAD SAAT HALAMAN DIBUKA
  // =================================================

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadPeserta();

    }
  );


  // =================================================
  // LOAD PESERTA
  // =================================================

  function loadPeserta() {

    const list =
      document.getElementById(
        "participantList"
      );


    const count =
      document.getElementById(
        "participantCount"
      );


    list.innerHTML =
      '<div class="loading">' +
      'Memuat daftar nama...' +
      '</div>';


    count.textContent =
      "Memuat peserta...";


    fetch(
      APPS_SCRIPT_URL +
      "?action=daftarPeserta"
    )

    .then(
      function(response) {

        if (!response.ok) {

          throw new Error(
            "HTTP error " +
            response.status
          );

        }


        return response.json();

      }
    )

    .then(
      function(result) {

        console.log(
          "Response peserta:",
          result
        );


        if (!result.success) {

          list.innerHTML =
            '<div class="empty">' +
            'Gagal mengambil data peserta.' +
            '</div>';


          showMessage(
            result.message ||
            "Gagal mengambil data peserta.",
            "error"
          );


          return;

        }


        pesertaList =
          result.data || [];


        tampilkanPeserta(
          pesertaList
        );

      }
    )

    .catch(
      function(error) {

        console.error(
          "Load peserta error:",
          error
        );


        list.innerHTML =
          '<div class="empty">' +
          'Gagal memuat daftar nama.' +
          '</div>';


        count.textContent =
          "";


        showMessage(
          "Tidak dapat terhubung ke Apps Script.",
          "error"
        );

      }
    );

  }


  // =================================================
  // SEARCH
  // =================================================

  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      function() {

        const keyword =
          this.value
            .toLowerCase()
            .trim();


        if (!keyword) {

          tampilkanPeserta(
            pesertaList
          );

          return;

        }


        const hasil =
          pesertaList.filter(
            function(peserta) {

              return peserta.nama
                .toLowerCase()
                .includes(keyword);

            }
          );


        tampilkanPeserta(
          hasil
        );

      }
    );


  // =================================================
  // TAMPILKAN PESERTA
  // =================================================

  function tampilkanPeserta(
    list
  ) {

    const container =
      document.getElementById(
        "participantList"
      );


    const count =
      document.getElementById(
        "participantCount"
      );


    container.innerHTML =
      "";


    // -----------------------------------------------
    // COUNT
    // -----------------------------------------------

    const total =
      list.length;


    const sudahAbsen =
      list.filter(
        function(peserta) {

          return peserta.sudahDatang;

        }
      ).length;


    count.textContent =
      total +
      " peserta ditampilkan • " +
      sudahAbsen +
      " sudah absen";


    // -----------------------------------------------
    // EMPTY
    // -----------------------------------------------

    if (total === 0) {

      container.innerHTML =
        '<div class="empty">' +
        'Nama peserta tidak ditemukan.' +
        '</div>';

      return;

    }


    // -----------------------------------------------
    // LIST
    // -----------------------------------------------

    list.forEach(
      function(peserta) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "participant";


        // Kalau sudah absen

        if (peserta.sudahDatang) {

          item.classList.add(
            "disabled"
          );

        }


        const status =
          peserta.sudahDatang
            ? "✓ Sudah absen"
            : "Belum absen";


        item.innerHTML =

          '<div class="participant-name">' +

          escapeHtml(
            peserta.nama
          ) +

          '</div>' +

          '<div class="participant-status">' +

          status +

          '</div>';


        item.addEventListener(
          "click",
          function() {

            pilihPeserta(
              peserta
            );

          }
        );


        container.appendChild(
          item
        );

      }
    );

  }


  // =================================================
  // PILIH PESERTA
  // =================================================

  function pilihPeserta(
    peserta
  ) {

    // -----------------------------------------------
    // CEK SUDAH ABSEN
    // -----------------------------------------------

    if (peserta.sudahDatang) {

      showMessage(
        peserta.nama +
        " sudah melakukan absensi.",
        "error"
      );

      return;

    }


    // -----------------------------------------------
    // SIMPAN PESERTA
    // -----------------------------------------------

    pesertaTerpilih =
      peserta;


    fotoBase64 =
      null;


    // -----------------------------------------------
    // TAMPILKAN NAMA
    // -----------------------------------------------

    document
      .getElementById(
        "selectedName"
      )
      .textContent =
      peserta.nama;


    document
      .getElementById(
        "selectedBox"
      )
      .style.display =
      "block";


    // -----------------------------------------------
    // TAMPILKAN CAMERA
    // -----------------------------------------------

    document
      .getElementById(
        "cameraSection"
      )
      .style.display =
      "block";


    // -----------------------------------------------
    // RESET PREVIEW
    // -----------------------------------------------

    document
      .getElementById(
        "preview"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "preview"
      )
      .src =
      "";


    document
      .getElementById(
        "submitBtn"
      )
      .disabled =
      true;


    document
      .getElementById(
        "submitBtn"
      )
      .textContent =
      "✓ Absen";


    hideMessage();


    // -----------------------------------------------
    // BUKA CAMERA
    // -----------------------------------------------

    bukaKamera();


    // -----------------------------------------------
    // SCROLL
    // -----------------------------------------------

    setTimeout(
      function() {

        document
          .getElementById(
            "cameraSection"
          )
          .scrollIntoView({
            behavior: "smooth"
          });

      },
      300
    );

  }


  // =================================================
  // BUKA KAMERA
  // =================================================

  function bukaKamera() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showMessage(
        "Browser tidak mendukung kamera.",
        "error"
      );

      return;

    }


    // Kalau ada kamera sebelumnya

    stopCamera();


    navigator
      .mediaDevices
      .getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      })

      .then(
        function(stream) {

          streamCamera =
            stream;


          const video =
            document.getElementById(
              "video"
            );


          video.srcObject =
            stream;


          video.play();

        }
      )

      .catch(
        function(error) {

          console.error(
            "Camera error:",
            error
          );


          showMessage(
            "Kamera tidak bisa dibuka. Silakan izinkan akses kamera pada browser.",
            "error"
          );

        }
      );

  }


  // =================================================
  // AMBIL FOTO
  // =================================================

  function ambilFoto() {

    if (!pesertaTerpilih) {

      showMessage(
        "Pilih nama peserta terlebih dahulu.",
        "error"
      );

      return;

    }


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      showMessage(
        "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
        "error"
      );

      return;

    }


    // -----------------------------------------------
    // SET CANVAS
    // -----------------------------------------------

    canvas.width =
      width;


    canvas.height =
      height;


    // -----------------------------------------------
    // COPY VIDEO KE CANVAS
    // -----------------------------------------------

    const context =
      canvas.getContext(
        "2d"
      );


    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    // -----------------------------------------------
    // CONVERT KE JPEG
    // -----------------------------------------------

    fotoBase64 =
      canvas.toDataURL(
        "image/jpeg",
        0.75
      );


    // -----------------------------------------------
    // PREVIEW
    // -----------------------------------------------

    const preview =
      document.getElementById(
        "preview"
      );


    preview.src =
      fotoBase64;


    preview.style.display =
      "block";


    // -----------------------------------------------
    // AKTIFKAN ABSEN
    // -----------------------------------------------

    document
      .getElementById(
        "submitBtn"
      )
      .disabled =
      false;


    showMessage(
      "Foto berhasil diambil. Jika sudah sesuai, klik Absen.",
      "success"
    );

  }


  // =================================================
  // SUBMIT ABSENSI
  // =================================================

  function submitAbsensi() {

    if (!pesertaTerpilih) {

      showMessage(
        "Peserta belum dipilih.",
        "error"
      );

      return;

    }


    if (!fotoBase64) {

      showMessage(
        "Silakan ambil foto terlebih dahulu.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "submitBtn"
      );


    button.disabled =
      true;


    button.textContent =
      "Menyimpan...";


    // -----------------------------------------------
    // DATA
    // -----------------------------------------------

    const data = {

      action:
        "simpanFotoDatang",

      id:
        pesertaTerpilih.id,

      nama:
        pesertaTerpilih.nama,

      foto:
        fotoBase64

    };


    console.log(
      "Mengirim absensi:",
      data.id,
      data.nama
    );


    // -----------------------------------------------
    // SEND KE APPS SCRIPT
    // -----------------------------------------------

    fetch(
      APPS_SCRIPT_URL,
      {

        method: "POST",

        body:
          JSON.stringify(data)

      }
    )

    .then(
      function(response) {

        return response.json();

      }
    )

    .then(
      function(result) {

        console.log(
          "Response absensi:",
          result
        );


        if (result.success) {

          showMessage(
            "✓ Absensi " +
            pesertaTerpilih.nama +
            " berhasil!",
            "success"
          );


          // -----------------------------------------
          // STOP CAMERA
          // -----------------------------------------

          stopCamera();


          // -----------------------------------------
          // UPDATE DATA LOKAL
          // -----------------------------------------

          pesertaTerpilih.sudahDatang =
            true;


          // -----------------------------------------
          // TUNGGU SEBENTAR
          // -----------------------------------------

          setTimeout(
            function() {

              resetForm();

              loadPeserta();

            },
            1500
          );


        } else {

          showMessage(
            result.message ||
            "Absensi gagal.",
            "error"
          );


          button.disabled =
            false;


          button.textContent =
            "✓ Absen";

        }

      }
    )

    .catch(
      function(error) {

        console.error(
          "Submit error:",
          error
        );


        showMessage(
          "Gagal mengirim data absensi. Coba lagi.",
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "✓ Absen";

      }
    );

  }


  // =================================================
  // STOP CAMERA
  // =================================================

  function stopCamera() {

    if (streamCamera) {

      streamCamera
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      streamCamera =
        null;

    }


    const video =
      document.getElementById(
        "video"
      );


    if (video) {

      video.srcObject =
        null;

    }

  }


  // =================================================
  // RESET FORM
  // =================================================

  function resetForm() {

    stopCamera();


    pesertaTerpilih =
      null;


    fotoBase64 =
      null;


    // -----------------------------------------------
    // SEARCH
    // -----------------------------------------------

    document
      .getElementById(
        "searchInput"
      )
      .value =
      "";


    // -----------------------------------------------
    // SELECTED
    // -----------------------------------------------

    document
      .getElementById(
        "selectedBox"
      )
      .style.display =
      "none";


    // -----------------------------------------------
    // CAMERA
    // -----------------------------------------------

    document
      .getElementById(
        "cameraSection"
      )
      .style.display =
      "none";


    // -----------------------------------------------
    // PREVIEW
    // -----------------------------------------------

    document
      .getElementById(
        "preview"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "preview"
      )
      .src =
      "";


    // -----------------------------------------------
    // SUBMIT
    // -----------------------------------------------

    document
      .getElementById(
        "submitBtn"
      )
      .disabled =
      true;


    document
      .getElementById(
        "submitBtn"
      )
      .textContent =
      "✓ Absen";


    hideMessage();


    // -----------------------------------------------
    // TAMPILKAN SEMUA PESERTA LAGI
    // -----------------------------------------------

    tampilkanPeserta(
      pesertaList
    );


    // -----------------------------------------------
    // SCROLL KE ATAS
    // -----------------------------------------------

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // =================================================
  // MESSAGE
  // =================================================

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.className =
      type;


    message.style.display =
      "block";

  }


  function hideMessage() {

    const message =
      document.getElementById(
        "message"
      );


    message.style.display =
      "none";


    message.className =
      "";

  }


  // =================================================
  // ESCAPE HTML
  // =================================================

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }


</script>


</body>

</html>
