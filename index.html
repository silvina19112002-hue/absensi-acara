
<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Absensi Acara</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }


    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
    }


    h1 {
      text-align: center;
      margin-top: 0;
    }


    /* ==========================================
       PILIH MODE
    ========================================== */

    #pilihMode {
      text-align: center;
    }


    #pilihMode p {
      margin-bottom: 20px;
    }


    /* ==========================================
       SEARCH NAMA
    ========================================== */

    #pilihPeserta {
      display: none;
    }


    #searchNama {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 10px;
      outline: none;
    }


    #searchNama:focus {
      border-color: #555;
    }


    #daftarNama {
      display: none;
      max-height: 260px;
      overflow-y: auto;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      text-align: left;
    }


    .nama-item {
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }


    .nama-item:hover {
      background: #f3f3f3;
    }


    .nama-item:last-child {
      border-bottom: none;
    }


    /* ==========================================
       HASIL
    ========================================== */

    #hasil {
      text-align: center;
      margin: 20px 0;
      font-size: 18px;
      line-height: 1.5;
    }


    /* ==========================================
       CAMERA
    ========================================== */

    #camera {
      display: none;
      text-align: center;
    }


    video {
      width: 100%;
      border-radius: 12px;
      background: black;
    }


    canvas {
      display: none;
    }


    /* ==========================================
       BUTTON
    ========================================== */

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }


    .btn-datang {
      background: #198754;
      color: white;
    }


    .btn-pulang {
      background: #0d6efd;
      color: white;
    }


    #bukaKamera {
      display: none;
      background: #111;
      color: white;
    }


    #ambilFoto {
      display: none;
      background: #111;
      color: white;
    }


    #reset {
      display: none;
      background: #ddd;
      color: #111;
    }


    #gantiMode {
      display: none;
      background: #eee;
      color: #111;
    }


    /* ==========================================
       STATUS
    ========================================== */

    .success {
      color: green;
      font-weight: bold;
    }


    .error
