<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Acara</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .name-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .name-item {
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      transition: 0.2s;
    }

    .name-item:hover {
      background: #f0f4ff;
    }

    .name-item.selected {
      background: #e8f0ff;
      border-color: #4a73e8;
    }

    .name-item.disabled {
      background: #f3f3f3;
      color: #999;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .selected-box {
      display: none;
      padding: 15px;
      background: #f5f7ff;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .selected-box.show {
      display: block;
    }

    .selected-name {
      font-size: 18px;
      font-weight: bold;
    }

    .camera-section {
      display: none;
      margin-top: 20px;
    }

    .camera-section.show {
      display: block;
    }

    video,
    canvas {
      width: 100%;
      max-width: 100%;
      border-radius: 10px;
      background: #000;
      display: block;
    }

    canvas {
      display: none;
    }

    .preview {
      display: none;
      margin-top: 15px;
    }

    .preview.show {
      display: block;
    }

    .preview img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-camera {
      background: #222;
      color: white;
    }

    .btn-capture {
      background: #4a73e8;
      color: white;
    }

    .btn-save {
      background: #20a464;
      color: white;
    }

    .btn-reset {
      background: #ddd;
      color: #222;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e7f7ee;
      color: #167342;
    }

    .message.error {
      background: #fdeaea;
      color: #b42318;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Absensi Acara</h1>
  <div class="subtitle">Pilih nama dan ambil foto</div>

  <label for="search">Cari Nama Peserta</label>
  <input
    type="text"
    id="search"
    placeholder="Ketik nama..."
    oninput="filterNama()"
  >

  <div id="nameList" class="name-list">
    <div class="loading">Memuat daftar peserta...</div>
  </div>

  <div id="selectedBox" class="selected-box">
    <div>Nama terpilih:</div>
    <div id="selectedName" class="selected-name"></div>
  </div>

  <div id="cameraSection" class="camera-section">

    <label>Foto Kehadiran</label>

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <button
      id="captureBtn"
      class="btn-capture"
      onclick="ambilFoto()"
    >
      📸 Ambil Foto
    </button>

    <div id="preview" class="preview">
      <img id="previewImage" alt="Preview foto">
    </div>

    <button
      id="saveBtn"
      class="btn-save"
      onclick="simpanFoto()"
      disabled
    >
      💾 Simpan Kehadiran
    </button>

    <button
      class="btn-reset"
      onclick="resetAbsensi()"
    >
      ↩️ Pilih Nama Lain
    </button>

  </div>

  <div id="message" class="message"></div>

</div>

<script>

  // =========================================================
  // CONFIG
  // =========================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxbdqh0t_tE8JovVB9tYK7ya1RtaiQTrc5CI2zlSFj0GG3HJXyQR4ot1wRWibAIJTI0/exec";


  // =========================================================
  // VARIABLES
  // =========================================================

  let peserta = [];
  let pesertaTerpilih = null;
  let fotoBase64 = null;
  let stream = null;


  // =========================================================
  // LOAD DATA
  // =========================================================

  window.onload = function() {
    loadPeserta();
  };


  async function loadPeserta() {

    const list = document.getElementById("nameList");

    list.innerHTML =
      '<div class="loading">Memuat daftar peserta...</div>';

    try {

      const response = await fetch(
        API_URL + "?action=daftarPeserta"
      );

      if (!response.ok) {
        throw new Error("HTTP error " + response.status);
      }

      const result = await response.json();

      if (!result.success) {
        throw new Error(
          result.message || "Gagal mengambil data peserta"
        );
      }

      peserta = result.data || [];

      tampilkanNama(peserta);

    } catch (error) {

      console.error(error);

      list.innerHTML = `
        <div class="empty">
          Tidak dapat memuat daftar peserta.<br>
          Silakan refresh halaman.
        </div>
      `;

      showMessage(
        "Tidak dapat terhubung ke Apps Script.",
        "error"
      );
    }
  }


  // =========================================================
  // DISPLAY NAME
  // =========================================================

  function tampilkanNama(data) {

    const list = document.getElementById("nameList");

    list.innerHTML = "";

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">Peserta tidak ditemukan.</div>';

      return;
    }

    data.forEach(function(item) {

      const div = document.createElement("div");

      div.className = "name-item";

      if (item.sudahDatang) {
        div.classList.add("disabled");
      }

      let status = "";

      if (item.sudahDatang) {

        status = `
          <div class="status">
            ✓ Sudah hadir
            ${item.jamDatang ? "• " + item.jamDatang : ""}
          </div>
        `;

      }

      div.innerHTML = `
        <div>${escapeHtml(item.nama)}</div>
        ${status}
      `;

      if (!item.sudahDatang) {

        div.onclick = function() {
          pilihPeserta(item);
        };

      }

      list.appendChild(div);

    });
  }


  // =========================================================
  // SEARCH
  // =========================================================

  function filterNama() {

    const keyword =
      document.getElementById("search").value
        .toLowerCase()
        .trim();

    if (!keyword) {

      tampilkanNama(peserta);

      return;
    }

    const hasil = peserta.filter(function(item) {

      return item.nama
        .toLowerCase()
        .includes(keyword);

    });

    tampilkanNama(hasil);
  }


  // =========================================================
  // SELECT PARTICIPANT
  // =========================================================

  function pilihPeserta(item) {

    if (item.sudahDatang) {
      return;
    }

    pesertaTerpilih = item;
    fotoBase64 = null;

    document.getElementById("selectedName").textContent =
      item.nama;

    document
      .getElementById("selectedBox")
      .classList.add("show");

    document
      .getElementById("cameraSection")
      .classList.add("show");

    document.getElementById("preview").classList.remove("show");

    document.getElementById("saveBtn").disabled = true;

    bukaKamera();

    window.scrollTo({
      top: document.getElementById("cameraSection").offsetTop - 20,
      behavior: "smooth"
    });
  }


  // =========================================================
  // OPEN REAR CAMERA
  // =========================================================

  async function bukaKamera() {

    hentikanKamera();

    try {

      // Prioritas utama: kamera belakang
      try {

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              exact: "environment"
            }
          },
          audio: false
        });

      } catch (error) {

        console.log(
          "Exact environment camera gagal, mencoba kamera lain..."
        );

        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        // Setelah permission diberikan,
        // cari kamera belakang berdasarkan deviceId
        try {

          const devices =
            await navigator.mediaDevices.enumerateDevices();

          const cameras =
            devices.filter(function(device) {
              return device.kind === "videoinput";
            });

          const rearCamera =
            cameras.find(function(camera) {

              const label =
                (camera.label || "").toLowerCase();

              return (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment") ||
                label.includes("facing")
              );

            });

          if (rearCamera) {

            hentikanKamera();

            stream =
              await navigator.mediaDevices.getUserMedia({
                video: {
                  deviceId: {
                    exact: rearCamera.deviceId
                  }
                },
                audio: false
              });

            console.log(
              "Kamera belakang berhasil dipilih:",
              rearCamera.label
            );
          }

        } catch (deviceError) {

          console.log(
            "Tidak bisa mencari kamera belakang:",
            deviceError
          );

        }
      }

      const video =
        document.getElementById("video");

      video.srcObject = stream;

      await video.play();

    } catch (error) {

      console.error(error);

      showMessage(
        "Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan.",
        "error"
      );
    }
  }


  // =========================================================
  // TAKE PHOTO
  // =========================================================

  function ambilFoto() {

    if (!stream) {

      showMessage(
        "Kamera belum aktif.",
        "error"
      );

      return;
    }

    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const context =
      canvas.getContext("2d");

    // =====================================================
    // BATASI RESOLUSI FOTO
    // Supaya upload lebih cepat
    // =====================================================

    const MAX_SIZE = 1280;

    let width = video.videoWidth;
    let height = video.videoHeight;

    if (!width || !height) {

      showMessage(
        "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
        "error"
      );

      return;
    }

    if (width > height) {

      if (width > MAX_SIZE) {

        height =
          Math.round(
            height * MAX_SIZE / width
          );

        width = MAX_SIZE;
      }

    } else {

      if (height > MAX_SIZE) {

        width =
          Math.round(
            width * MAX_SIZE / height
          );

        height = MAX_SIZE;
      }
    }

    canvas.width = width;
    canvas.height = height;

    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    // =====================================================
    // JPEG QUALITY 60%
    // Ukuran file jauh lebih kecil
    // =====================================================

    fotoBase64 =
      canvas.toDataURL(
        "image/jpeg",
        0.6
      );

    // Tampilkan preview

    const previewImage =
      document.getElementById("previewImage");

    previewImage.src = fotoBase64;

    document
      .getElementById("preview")
      .classList.add("show");

    document
      .getElementById("saveBtn")
      .disabled = false;

    showMessage(
      "Foto berhasil diambil. Silakan simpan.",
      "success"
    );

    // Kamera bisa dihentikan setelah foto
    hentikanKamera();

    window.scrollTo({
      top:
        document.getElementById("preview").offsetTop - 20,
      behavior: "smooth"
    });
  }


  // =========================================================
  // SAVE PHOTO
  // =========================================================

  async function simpanFoto() {

    if (!pesertaTerpilih) {

      showMessage(
        "Silakan pilih nama peserta.",
        "error"
      );

      return;
    }

    if (!fotoBase64) {

      showMessage(
        "Silakan ambil foto terlebih dahulu.",
        "error"
      );

      return;
    }

    const saveBtn =
      document.getElementById("saveBtn");

    saveBtn.disabled = true;

    saveBtn.textContent =
      "⏳ Mengupload foto...";

    showMessage(
      "Sedang menyimpan foto, tunggu sebentar...",
      "success"
    );

    try {

      const data = {

        action: "simpanFotoDatang",

        id: pesertaTerpilih.id,

        nama: pesertaTerpilih.nama,

        foto: fotoBase64

      };


      const response = await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify(data)
        }
      );


      if (!response.ok) {

        throw new Error(
          "HTTP error " + response.status
        );
      }


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.message ||
          "Gagal menyimpan foto."
        );
      }


      // ================================================
      // BERHASIL
      // ================================================

      saveBtn.textContent =
        "✓ Berhasil Disimpan";

      showMessage(
        "✓ Absensi berhasil disimpan untuk " +
        pesertaTerpilih.nama,
        "success"
      );


      // Update status peserta di frontend

      const index =
        peserta.findIndex(function(item) {

          return String(item.id) ===
            String(pesertaTerpilih.id);

        });


      if (index !== -1) {

        peserta[index].sudahDatang = true;

        peserta[index].jamDatang =
          result.jamDatang || "";

      }


      // Setelah beberapa detik,
      // reset kembali ke daftar nama

      setTimeout(function() {

        resetAbsensi();

      }, 1800);


    } catch (error) {

      console.error(error);

      saveBtn.disabled = false;

      saveBtn.textContent =
        "💾 Simpan Kehadiran";

      showMessage(
        error.message ||
        "Gagal menyimpan foto. Silakan coba lagi.",
        "error"
      );
    }
  }


  // =========================================================
  // STOP CAMERA
  // =========================================================

  function hentikanKamera() {

    if (stream) {

      stream.getTracks().forEach(
        function(track) {
          track.stop();
        }
      );

      stream = null;
    }

    const video =
      document.getElementById("video");

    if (video) {
      video.srcObject = null;
    }
  }


  // =========================================================
  // RESET
  // =========================================================

  function resetAbsensi() {

    hentikanKamera();

    pesertaTerpilih = null;
    fotoBase64 = null;

    document.getElementById("selectedName")
      .textContent = "";

    document.getElementById("search")
      .value = "";

    document
      .getElementById("selectedBox")
      .classList.remove("show");

    document
      .getElementById("cameraSection")
      .classList.remove("show");

    document
      .getElementById("preview")
      .classList.remove("show");

    document
      .getElementById("saveBtn")
      .disabled = true;

    document
      .getElementById("saveBtn")
      .textContent =
        "💾 Simpan Kehadiran";

    hideMessage();

    tampilkanNama(peserta);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // =========================================================
  // MESSAGE
  // =========================================================

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message show " + type;
  }


  function hideMessage() {

    const message =
      document.getElementById("message");

    message.className =
      "message";
  }


  // =========================================================
  // ESCAPE HTML
  // =========================================================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text == null ? "" : text;

    return div.innerHTML;
  }


  // =========================================================
  // STOP CAMERA WHEN LEAVING PAGE
  // =========================================================

  window.addEventListener(
    "beforeunload",
    function() {
      hentikanKamera();
    }
  );

</script>

</body>
</html>
