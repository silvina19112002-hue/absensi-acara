<body>

<div class="container">

  <h1>Absensi Acara</h1>

  <div class="subtitle">
    Pilih nama dan ambil foto
  </div>

  <!-- SEARCH -->
  <label for="search">
    Cari Nama Peserta
  </label>

  <input
    type="text"
    id="search"
    placeholder="Ketik nama..."
    autocomplete="off"
    oninput="filterNama()"
  >

  <!-- NAME LIST -->
  <div id="nameList" class="name-list">
    <div class="loading">
      Memuat daftar peserta...
    </div>
  </div>

  <!-- SELECTED PARTICIPANT -->
  <div id="selectedBox" class="selected-box">

    <div>
      Nama terpilih:
    </div>

    <div
      id="selectedName"
      class="selected-name"
    ></div>

  </div>

  <!-- CAMERA -->
  <div
    id="cameraSection"
    class="camera-section"
  >

    <label>
      Foto Kehadiran
    </label>

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <div class="camera-help">
      Pastikan wajah terlihat jelas sebelum mengambil foto.
    </div>

    <canvas id="canvas"></canvas>

    <button
      id="captureBtn"
      class="btn-capture"
      onclick="ambilFoto()"
    >
      📸 Ambil Foto
    </button>

    <!-- PREVIEW -->
    <div
      id="preview"
      class="preview"
    >
      <img
        id="previewImage"
        alt="Preview foto"
      >
    </div>

    <!-- SAVE -->
    <button
      id="saveBtn"
      class="btn-save"
      onclick="simpanFoto()"
      disabled
    >
      💾 Simpan Kehadiran
    </button>

    <!-- RESET -->
    <button
      class="btn-reset"
      onclick="resetAbsensi()"
    >
      ↩️ Pilih Nama Lain
    </button>

  </div>

  <!-- MESSAGE -->
  <div
    id="message"
    class="message"
  ></div>

</div>


<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxbdqh0t_tE8JovVB9tYK7ya1RtaiQTrc5CI2zlSFj0GG3HJXyQR4ot1wRWibAIJTI0/exec";


  /* =========================================================
     VARIABLES
  ========================================================= */

  let peserta = [];

  let pesertaTerpilih = null;

  let fotoBase64 = null;

  let stream = null;


  /* =========================================================
     PAGE LOAD
  ========================================================= */

  window.addEventListener(
    "load",
    function() {

      loadPeserta();

    }
  );


  /* =========================================================
     LOAD PESERTA
  ========================================================= */

  async function loadPeserta() {

    const list =
      document.getElementById("nameList");

    list.innerHTML =
      '<div class="loading">⏳ Memuat daftar peserta...</div>';

    hideMessage();


    try {

      /*
       * Cache busting.
       * Supaya browser tidak mengambil response lama.
       */

      const url =
        API_URL +
        "?action=daftarPeserta&_=" +
        Date.now();


      console.log(
        "Mengambil data dari:",
        url
      );


      /*
       * Timeout 20 detik.
       */

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          function() {
            controller.abort();
          },
          20000
        );


      const response =
        await fetch(
          url,
          {
            method: "GET",
            mode: "cors",
            cache: "no-store",
            redirect: "follow",
            signal: controller.signal
          }
        );


      clearTimeout(timeout);


      console.log(
        "HTTP status:",
        response.status
      );


      if (!response.ok) {

        throw new Error(
          "Server mengembalikan HTTP " +
          response.status
        );

      }


      /*
       * Ambil response sebagai TEXT dulu.
       * Ini lebih aman daripada langsung response.json().
       */

      const text =
        await response.text();


      console.log(
        "Response Apps Script:",
        text.substring(0, 500)
      );


      if (!text) {

        throw new Error(
          "Response dari server kosong."
        );

      }


      let result;


      try {

        result =
          JSON.parse(text);

      } catch (jsonError) {

        console.error(
          "JSON parse error:",
          jsonError
        );

        throw new Error(
          "Response server bukan JSON yang valid."
        );

      }


      /*
       * Validasi response.
       */

      if (
        !result ||
        result.success !== true
      ) {

        throw new Error(
          result &&
          result.message
            ? result.message
            : "Gagal mengambil data peserta."
        );

      }


      /*
       * Pastikan data berupa array.
       */

      if (
        !Array.isArray(result.data)
      ) {

        throw new Error(
          "Format data peserta tidak valid."
        );

      }


      peserta =
        result.data;


      console.log(
        "Jumlah peserta:",
        peserta.length
      );


      /*
       * Tampilkan data.
       */

      tampilkanNama(
        peserta
      );


    } catch (error) {

      console.error(
        "GAGAL LOAD PESERTA:",
        error
      );


      let pesan =
        "Tidak dapat memuat daftar peserta.";


      if (
        error.name === "AbortError"
      ) {

        pesan =
          "Koneksi ke server terlalu lama. Silakan coba lagi.";

      } else if (
        error.message
      ) {

        pesan =
          error.message;

      }


      list.innerHTML = `

        <div class="empty">

          ❌ Gagal memuat peserta.

          <br><br>

          <small>
            ${escapeHtml(pesan)}
          </small>

          <button
            class="retry-btn"
            onclick="loadPeserta()"
          >
            🔄 Coba Lagi
          </button>

        </div>

      `;


      showMessage(
        "Gagal mengambil daftar peserta dari server.",
        "error"
      );

    }

  }


  /* =========================================================
     DISPLAY NAME
  ========================================================= */

  function tampilkanNama(data) {

    const list =
      document.getElementById("nameList");


    list.innerHTML = "";


    if (
      !data ||
      data.length === 0
    ) {

      list.innerHTML =
        '<div class="empty">Peserta tidak ditemukan.</div>';

      return;

    }


    data.forEach(
      function(item) {

        const div =
          document.createElement("div");


        div.className =
          "name-item";


        /*
         * Peserta yang sudah hadir
         * tidak bisa dipilih lagi.
         */

        if (
          item.sudahDatang
        ) {

          div.classList.add(
            "disabled"
          );

        }


        let status = "";


        if (
          item.sudahDatang
        ) {

          status = `

            <div class="status">

              ✓ Sudah hadir

              ${
                item.jamDatang
                  ? "• " +
                    escapeHtml(
                      item.jamDatang
                    )
                  : ""
              }

            </div>

          `;

        }


        div.innerHTML = `

          <div>
            ${escapeHtml(item.nama)}
          </div>

          ${status}

        `;


        if (
          !item.sudahDatang
        ) {

          div.addEventListener(
            "click",
            function() {

              pilihPeserta(item);

            }
          );

        }


        list.appendChild(div);

      }
    );

  }


  /* =========================================================
     SEARCH
  ========================================================= */

  function filterNama() {

    const keyword =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if (!keyword) {

      tampilkanNama(
        peserta
      );

      return;

    }


    const hasil =
      peserta.filter(
        function(item) {

          return String(
            item.nama || ""
          )
          .toLowerCase()
          .includes(
            keyword
          );

        }
      );


    tampilkanNama(
      hasil
    );

  }


  /* =========================================================
     SELECT PARTICIPANT
  ========================================================= */

  function pilihPeserta(item) {

    if (
      !item ||
      item.sudahDatang
    ) {

      return;

    }


    pesertaTerpilih =
      item;

    fotoBase64 =
      null;


    document
      .getElementById("selectedName")
      .textContent =
      item.nama;


    document
      .getElementById("selectedBox")
      .classList.add(
        "show"
      );


    document
      .getElementById("cameraSection")
      .classList.add(
        "show"
      );


    document
      .getElementById("preview")
      .classList.remove(
        "show"
      );


    document
      .getElementById("saveBtn")
      .disabled =
      true;


    document
      .getElementById("captureBtn")
      .disabled =
      false;


    showMessage(
      "Membuka kamera...",
      "info"
    );


    bukaKamera();


    setTimeout(
      function() {

        const camera =
          document.getElementById(
            "cameraSection"
          );

        if (camera) {

          camera.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        }

      },
      200
    );

  }


  /* =========================================================
     OPEN CAMERA
  ========================================================= */

  async function bukaKamera() {

    hentikanKamera();


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showMessage(
        "Browser tidak mendukung akses kamera.",
        "error"
      );

      return;

    }


    try {

      /*
       * Percobaan pertama:
       * kamera belakang.
       */

      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  exact: "environment"
                }

              },

              audio: false

            });


      } catch (error) {

        console.log(
          "Kamera environment gagal:",
          error
        );


        /*
         * Fallback:
         * kamera apa saja.
         */

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: true,

              audio: false

            });


        /*
         * Setelah permission diberikan,
         * cari kamera belakang.
         */

        try {

          const devices =
            await navigator.mediaDevices
              .enumerateDevices();


          const cameras =
            devices.filter(
              function(device) {

                return (
                  device.kind ===
                  "videoinput"
                );

              }
            );


          const rearCamera =
            cameras.find(
              function(camera) {

                const label =
                  (
                    camera.label ||
                    ""
                  )
                  .toLowerCase();


                return (
                  label.includes("back") ||
                  label.includes("rear") ||
                  label.includes("environment") ||
                  label.includes("facing")
                );

              }
            );


          if (
            rearCamera
          ) {

            hentikanKamera();


            stream =
              await navigator.mediaDevices
                .getUserMedia({

                  video: {

                    deviceId: {
                      exact:
                        rearCamera.deviceId
                    }

                  },

                  audio: false

                });

          }

        } catch (deviceError) {

          console.log(
            "Gagal memilih kamera belakang:",
            deviceError
          );

        }

      }


      const video =
        document.getElementById(
          "video"
        );


      video.srcObject =
        stream;


      await video.play();


      hideMessage();


    } catch (error) {

      console.error(
        "Camera error:",
        error
      );


      showMessage(
        "Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan.",
        "error"
      );

    }

  }


  /* =========================================================
     TAKE PHOTO
  ========================================================= */

  function ambilFoto() {

    if (!stream) {

      showMessage(
        "Kamera belum aktif.",
        "error"
      );

      return;

    }


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const context =
      canvas.getContext(
        "2d"
      );


    let width =
      video.videoWidth;


    let height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      showMessage(
        "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
        "error"
      );

      return;

    }


    /*
     * Maksimum 1024 px.
     * Supaya file tidak terlalu besar.
     */

    const MAX_SIZE =
      1024;


    if (
      width > height
    ) {

      if (
        width > MAX_SIZE
      ) {

        height =
          Math.round(
            height *
            MAX_SIZE /
            width
          );

        width =
          MAX_SIZE;

      }

    } else {

      if (
        height > MAX_SIZE
      ) {

        width =
          Math.round(
            width *
            MAX_SIZE /
            height
          );

        height =
          MAX_SIZE;

      }

    }


    canvas.width =
      width;

    canvas.height =
      height;


    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
     * JPEG 65%.
     */

    fotoBase64 =
      canvas.toDataURL(
        "image/jpeg",
        0.65
      );


    /*
     * Preview.
     */

    const previewImage =
      document.getElementById(
        "previewImage"
      );


    previewImage.src =
      fotoBase64;


    document
      .getElementById("preview")
      .classList.add(
        "show"
      );


    document
      .getElementById("saveBtn")
      .disabled =
      false;


    showMessage(
      "✓ Foto berhasil diambil. Silakan simpan.",
      "success"
    );


    /*
     * Stop kamera supaya tidak
     * terus menggunakan kamera.
     */

    hentikanKamera();


    document
      .getElementById("preview")
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }


  /* =========================================================
     SAVE PHOTO
  ========================================================= */

  async function simpanFoto() {

    if (
      !pesertaTerpilih
    ) {

      showMessage(
        "Silakan pilih nama peserta.",
        "error"
      );

      return;

    }


    if (
      !fotoBase64
    ) {

      showMessage(
        "Silakan ambil foto terlebih dahulu.",
        "error"
      );

      return;

    }


    const saveBtn =
      document.getElementById(
        "saveBtn"
      );


    const captureBtn =
      document.getElementById(
        "captureBtn"
      );


    saveBtn.disabled =
      true;

    captureBtn.disabled =
      true;


    saveBtn.textContent =
      "⏳ Menyimpan...";


    showMessage(
      "Sedang menyimpan foto ke server. Jangan tutup halaman...",
      "info"
    );


    try {

      const data = {

        action:
          "simpanFotoDatang",

        id:
          pesertaTerpilih.id,

        nama:
          pesertaTerpilih.nama,

        foto:
          fotoBase64

      };


      console.log(
        "Mengirim foto untuk:",
        pesertaTerpilih.nama
      );


      /*
       * text/plain sengaja dipakai
       * agar tidak memicu preflight OPTIONS.
       */

      const response =
        await fetch(
          API_URL,
          {

            method: "POST",

            mode: "cors",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(data)

          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "Server mengembalikan HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      console.log(
        "Response upload:",
        text
      );


      if (!text) {

        throw new Error(
          "Server tidak mengembalikan response."
        );

      }


      let result;


      try {

        result =
          JSON.parse(text);

      } catch (error) {

        throw new Error(
          "Response upload tidak valid."
        );

      }


      if (
        !result.success
      ) {

        throw new Error(
          result.message ||
          "Gagal menyimpan foto."
        );

      }


      /*
       * BERHASIL
       */

      saveBtn.textContent =
        "✓ Berhasil Disimpan";


      showMessage(
        "✓ Absensi berhasil disimpan untuk " +
        pesertaTerpilih.nama,
        "success"
      );


      /*
       * Update data lokal.
       */

      const index =
        peserta.findIndex(
          function(item) {

            return (
              String(item.id) ===
              String(
                pesertaTerpilih.id
              )
            );

          }
        );


      if (
        index !== -1
      ) {

        peserta[index].sudahDatang =
          true;

        peserta[index].jamDatang =
          result.waktu ||
          result.jamDatang ||
          "";

      }


      /*
       * Tunggu sebentar lalu kembali
       * ke daftar peserta.
       */

      setTimeout(
        function() {

          resetAbsensi();

        },
        1800
      );


    } catch (error) {

      console.error(
        "UPLOAD ERROR:",
        error
      );


      /*
       * Jangan langsung reset.
       * Foto tetap ada di preview
       * supaya user bisa mencoba lagi.
       */

      saveBtn.disabled =
        false;

      captureBtn.disabled =
        false;


      saveBtn.textContent =
        "💾 Simpan Kehadiran";


      showMessage(
        "❌ " +
        (
          error.message ||
          "Gagal menyimpan foto."
        ),
        "error"
      );

    }

  }


  /* =========================================================
     STOP CAMERA
  ========================================================= */

  function hentikanKamera() {

    if (
      stream
    ) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      stream =
        null;

    }


    const video =
      document.getElementById(
        "video"
      );


    if (
      video
    ) {

      video.srcObject =
        null;

    }

  }


  /* =========================================================
     RESET
  ========================================================= */

  function resetAbsensi() {

    hentikanKamera();


    pesertaTerpilih =
      null;

    fotoBase64 =
      null;


    document
      .getElementById(
        "selectedName"
      )
      .textContent =
      "";


    document
      .getElementById(
        "search"
      )
      .value =
      "";


    document
      .getElementById(
        "selectedBox"
      )
      .classList.remove(
        "show"
      );


    document
      .getElementById(
        "cameraSection"
      )
      .classList.remove(
        "show"
      );


    document
      .getElementById(
        "preview"
      )
      .classList.remove(
        "show"
      );


    document
      .getElementById(
        "saveBtn"
      )
      .disabled =
      true;


    document
      .getElementById(
        "saveBtn"
      )
      .textContent =
      "💾 Simpan Kehadiran";


    document
      .getElementById(
        "captureBtn"
      )
      .disabled =
      false;


    hideMessage();


    /*
     * Tampilkan data terbaru
     * yang sudah di-update lokal.
     */

    tampilkanNama(
      peserta
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================================================
     MESSAGE
  ========================================================= */

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.className =
      "message show " +
      type;

  }


  function hideMessage() {

    const message =
      document.getElementById(
        "message"
      );


    message.className =
      "message";

  }


  /* =========================================================
     ESCAPE HTML
  ========================================================= */

  function escapeHtml(text) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text == null
        ? ""
        : String(text);


    return div.innerHTML;

  }


  /* =========================================================
     STOP CAMERA WHEN LEAVING
  ========================================================= */

  window.addEventListener(
    "beforeunload",
    function() {

      hentikanKamera();

    }
  );

</script>

</html>
