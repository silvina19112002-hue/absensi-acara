<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Absensi Acara</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f5f6f8;

      color: #222;

    }


    .container {

      max-width: 600px;

      margin: auto;

      background: white;

      padding: 25px;

      border-radius: 15px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);

    }


    h1 {

      text-align: center;

      margin-bottom: 8px;

    }


    .subtitle {

      text-align: center;

      color: #666;

      margin-bottom: 25px;

    }


    label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    input[type="text"] {

      width: 100%;

      padding: 12px;

      border: 1px solid #ddd;

      border-radius: 8px;

      font-size: 16px;

      margin-bottom: 15px;

    }


    .name-list {

      display: flex;

      flex-direction: column;

      gap: 8px;

      max-height: 350px;

      overflow-y: auto;

      margin-bottom: 15px;

    }


    .name-item {

      padding: 13px 15px;

      border: 1px solid #ddd;

      border-radius: 8px;

      cursor: pointer;

      background: white;

    }


    .name-item:hover {

      background: #f0f4ff;

    }


    .name-item.disabled {

      background: #f3f3f3;

      color: #999;

      cursor: not-allowed;

    }


    .status {

      font-size: 13px;

      color: #777;

      margin-top: 4px;

    }


    .add-box {

      display: none;

      padding: 15px;

      border-radius: 10px;

      background: #fff8e6;

      margin-bottom: 20px;

    }


    .add-box.show {

      display: block;

    }


    .add-title {

      font-weight: bold;

      margin-bottom: 5px;

    }


    .add-description {

      font-size: 14px;

      color: #666;

      margin-bottom: 10px;

    }


    .selected-box {

      display: none;

      padding: 15px;

      background: #f5f7ff;

      border-radius: 10px;

      margin-bottom: 20px;

    }


    .selected-box.show {

      display: block;

    }


    .selected-name {

      font-size: 18px;

      font-weight: bold;

    }


    .camera-section {

      display: none;

      margin-top: 20px;

    }


    .camera-section.show {

      display: block;

    }


    video {

      width: 100%;

      border-radius: 10px;

      background: #000;

      display: block;

      object-fit: cover;

    }


    canvas {

      display: none;

    }


    .camera-info {

      text-align: center;

      color: #666;

      font-size: 13px;

      margin-bottom: 8px;

    }


    .preview {

      display: none;

      margin-top: 15px;

    }


    .preview.show {

      display: block;

    }


    .preview img {

      width: 100%;

      border-radius: 10px;

    }


    button {

      width: 100%;

      border: none;

      padding: 13px;

      border-radius: 8px;

      font-size: 16px;

      cursor: pointer;

      margin-top: 10px;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .btn-add {

      background: #f0a500;

      color: white;

    }


    .btn-capture {

      background: #4a73e8;

      color: white;

    }


    .btn-save {

      background: #20a464;

      color: white;

    }


    .btn-reset {

      background: #ddd;

      color: #222;

    }


    .message {

      padding: 12px;

      border-radius: 8px;

      margin-top: 15px;

      display: none;

      text-align: center;

    }


    .message.show {

      display: block;

    }


    .message.success {

      background: #e7f7ee;

      color: #167342;

    }


    .message.error {

      background: #fdeaea;

      color: #b42318;

    }


    .loading {

      text-align: center;

      padding: 20px;

      color: #666;

    }


    .empty {

      text-align: center;

      padding: 15px;

      color: #888;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    Absensi Acara
  </h1>


  <div class="subtitle">
    Pilih nama dan ambil foto
  </div>


  <!-- SEARCH -->

  <label for="search">
    Cari Nama Peserta
  </label>


  <input
    type="text"
    id="search"
    placeholder="Ketik nama..."
    oninput="filterNama()"
  >


  <!-- LIST -->

  <div
    id="nameList"
    class="name-list"
  >

    <div class="loading">
      Memuat daftar peserta...
    </div>

  </div>


  <!-- TAMBAH NAMA -->

  <div
    id="addBox"
    class="add-box"
  >

    <div class="add-title">
      Nama tidak ditemukan
    </div>

    <div class="add-description">
      Kalau peserta belum ada di daftar,
      kamu bisa menambahkan nama baru.
    </div>


    <button
      class="btn-add"
      onclick="tampilkanFormTambah()"
    >
      ➕ Tambah Nama Baru
    </button>

  </div>


  <!-- SELECTED -->

  <div
    id="selectedBox"
    class="selected-box"
  >

    <div>
      Nama terpilih:
    </div>

    <div
      id="selectedName"
      class="selected-name"
    ></div>

  </div>


  <!-- CAMERA -->

  <div
    id="cameraSection"
    class="camera-section"
  >

    <label>
      Foto Kehadiran
    </label>


    <div class="camera-info">
      📷 Kamera belakang
    </div>


    <video
      id="video"
      autoplay
      playsinline
    ></video>


    <canvas
      id="canvas"
    ></canvas>


    <button
      id="captureBtn"
      class="btn-capture"
      onclick="ambilFoto()"
    >
      📸 Ambil Foto
    </button>


    <!-- PREVIEW -->

    <div
      id="preview"
      class="preview"
    >

      <img
        id="previewImage"
        alt="Preview foto"
      >

    </div>


    <!-- SAVE -->

    <button
      id="saveBtn"
      class="btn-save"
      onclick="simpanFoto()"
      disabled
    >
      💾 Simpan Kehadiran
    </button>


    <button
      class="btn-reset"
      onclick="resetAbsensi()"
    >
      ↩️ Pilih Nama Lain
    </button>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>


</div>


<script>


// =========================================================
// CONFIG
// =========================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxbdqh0t_tE8JovVB9tYK7ya1RtaiQTrc5CI2zlSFj0GG3HJXyQR4ot1wRWibAIJTI0/exec";


// =========================================================
// VARIABLES
// =========================================================

let peserta = [];

let pesertaTerpilih = null;

let fotoBase64 = null;

let stream = null;


// =========================================================
// LOAD
// =========================================================

window.onload = function() {

  loadPeserta();

};


async function loadPeserta() {

  const list =
    document.getElementById(
      "nameList"
    );


  list.innerHTML =
    '<div class="loading">Memuat daftar peserta...</div>';


  try {

    const response =
      await fetch(
        API_URL +
        "?action=daftarPeserta"
      );


    if (!response.ok) {

      throw new Error(
        "HTTP error " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal mengambil data"
      );

    }


    peserta =
      result.data || [];


    tampilkanNama(
      peserta
    );


  } catch (error) {

    console.error(error);


    list.innerHTML = `
      <div class="empty">
        Tidak dapat memuat daftar peserta.<br>
        Silakan refresh halaman.
      </div>
    `;


    showMessage(
      "Tidak dapat terhubung ke Apps Script.",
      "error"
    );

  }

}


// =========================================================
// TAMPILKAN NAMA
// =========================================================

function tampilkanNama(data) {

  const list =
    document.getElementById(
      "nameList"
    );


  const addBox =
    document.getElementById(
      "addBox"
    );


  list.innerHTML = "";


  // Sembunyikan tombol tambah dulu

  addBox.classList.remove(
    "show"
  );


  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML =
      '<div class="empty">Nama tidak ditemukan.</div>';


    // Kalau sedang search,
    // tampilkan tombol tambah

    const keyword =
      document
        .getElementById("search")
        .value
        .trim();


    if (keyword) {

      addBox.classList.add(
        "show"
      );

    }


    return;

  }


  data.forEach(
    function(item) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "name-item";


      if (
        item.sudahDatang
      ) {

        div.classList.add(
          "disabled"
        );

      }


      let status = "";


      if (
        item.sudahDatang
      ) {

        status = `
          <div class="status">
            ✓ Sudah hadir
            ${
              item.jamDatang
                ? "• " +
                  item.jamDatang
                : ""
            }
          </div>
        `;

      }


      div.innerHTML = `
        <div>
          ${escapeHtml(item.nama)}
        </div>

        ${status}
      `;


      if (
        !item.sudahDatang
      ) {

        div.onclick =
          function() {

            pilihPeserta(
              item
            );

          };

      }


      list.appendChild(
        div
      );

    }
  );

}


// =========================================================
// SEARCH
// =========================================================

function filterNama() {

  const keyword =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase()
      .trim();


  if (!keyword) {

    tampilkanNama(
      peserta
    );

    return;

  }


  const hasil =
    peserta.filter(
      function(item) {

        return item.nama
          .toLowerCase()
          .includes(
            keyword
          );

      }
    );


  tampilkanNama(
    hasil
  );

}


// =========================================================
// FORM TAMBAH NAMA
// =========================================================

function tampilkanFormTambah() {

  const search =
    document.getElementById(
      "search"
    );


  const nama =
    search.value.trim();


  if (!nama) {

    showMessage(
      "Masukkan nama terlebih dahulu.",
      "error"
    );

    search.focus();

    return;

  }


  tambahPesertaBaru(
    nama
  );

}


// =========================================================
// TAMBAH PESERTA BARU
// =========================================================

async function tambahPesertaBaru(
  nama
) {

  const addBox =
    document.getElementById(
      "addBox"
    );


  addBox.innerHTML = `
    <div class="add-title">
      Menambahkan peserta...
    </div>

    <div class="add-description">
      Tunggu sebentar.
    </div>
  `;


  try {

    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "tambahPeserta",

              nama:
                nama

            })

        }

      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal menambahkan peserta."
      );

    }


    // ===================================================
    // PESERTA BERHASIL DITAMBAHKAN
    // ===================================================

    const pesertaBaru = {

      id:
        result.id,

      nama:
        result.nama,

      sudahDatang:
        false,

      jamDatang:
        ""

    };


    peserta.push(
      pesertaBaru
    );


    // Langsung pilih peserta

    pesertaTerpilih =
      pesertaBaru;


    document
      .getElementById(
        "selectedName"
      )
      .textContent =
        pesertaBaru.nama;


    document
      .getElementById(
        "selectedBox"
      )
      .classList
      .add("show");


    document
      .getElementById(
        "cameraSection"
      )
      .classList
      .add("show");


    document
      .getElementById(
        "preview"
      )
      .classList
      .remove("show");


    document
      .getElementById(
        "saveBtn"
      )
      .disabled =
        true;


    document
      .getElementById(
        "search"
      )
      .value =
        "";


    addBox.classList.remove(
      "show"
    );


    // Buka kamera belakang

    bukaKamera();


    showMessage(
      "Nama berhasil ditambahkan. Silakan ambil foto.",
      "success"
    );


  } catch (error) {

    console.error(error);


    addBox.innerHTML = `
      <div class="add-title">
        Nama tidak ditemukan
      </div>

      <div class="add-description">
        ${escapeHtml(error.message)}
      </div>

      <button
        class="btn-add"
        onclick="tampilkanFormTambah()"
      >
        ➕ Coba Tambah Lagi
      </button>
    `;

  }

}


// =========================================================
// PILIH PESERTA
// =========================================================

function pilihPeserta(item) {

  if (
    item.sudahDatang
  ) {

    return;

  }


  hentikanKamera();


  pesertaTerpilih =
    item;


  fotoBase64 =
    null;


  document
    .getElementById(
      "selectedName"
    )
    .textContent =
      item.nama;


  document
    .getElementById(
      "selectedBox"
    )
    .classList
    .add("show");


  document
    .getElementById(
      "cameraSection"
    )
    .classList
    .add("show");


  document
    .getElementById(
      "preview"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "saveBtn"
    )
    .disabled =
      true;


  document
    .getElementById(
      "saveBtn"
    )
    .textContent =
      "💾 Simpan Kehadiran";


  bukaKamera();


  window.scrollTo({

    top:
      document
        .getElementById(
          "cameraSection"
        )
        .offsetTop - 20,

    behavior:
      "smooth"

  });

}


// =========================================================
// KAMERA BELAKANG
// =========================================================

async function bukaKamera() {

  hentikanKamera();


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showMessage(
      "Browser tidak mendukung kamera.",
      "error"
    );

    return;

  }


  try {

    // ===================================================
    // WAJIB KAMERA BELAKANG
    // ===================================================

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {

              exact:
                "environment"

            }

          },

          audio:
            false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    await video.play();


    // ===================================================
    // CEK SETTING KAMERA
    // ===================================================

    const track =
      stream
        .getVideoTracks()[0];


    const settings =
      track.getSettings();


    console.log(
      "Camera settings:",
      settings
    );


    // Kalau browser memberi
    // facingMode dan bukan environment

    if (
      settings.facingMode &&
      settings.facingMode !==
        "environment"
    ) {

      hentikanKamera();


      showMessage(
        "Kamera belakang tidak berhasil dipilih.",
        "error"
      );


      return;

    }


    hideMessage();


  } catch (error) {

    console.error(
      "Kamera belakang gagal:",
      error
    );


    hentikanKamera();


    showMessage(
      "Kamera belakang tidak dapat dibuka. Pastikan izin kamera diberikan.",
      "error"
    );

  }

}


// =========================================================
// AMBIL FOTO
// =========================================================

function ambilFoto() {

  if (!stream) {

    showMessage(
      "Kamera belum aktif.",
      "error"
    );

    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const context =
    canvas.getContext(
      "2d"
    );


  // ===================================================
  // KECILKAN FOTO
  // ===================================================

  const MAX_SIZE =
    960;


  let width =
    video.videoWidth;


  let height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    showMessage(
      "Kamera belum siap.",
      "error"
    );

    return;

  }


  if (
    width > height
  ) {

    if (
      width > MAX_SIZE
    ) {

      height =
        Math.round(
          height *
          MAX_SIZE /
          width
        );


      width =
        MAX_SIZE;

    }

  } else {

    if (
      height > MAX_SIZE
    ) {

      width =
        Math.round(
          width *
          MAX_SIZE /
          height
        );


      height =
        MAX_SIZE;

    }

  }


  canvas.width =
    width;


  canvas.height =
    height;


  context.drawImage(

    video,

    0,
    0,

    width,
    height

  );


  // ===================================================
  // JPEG 55%
  // ===================================================

  fotoBase64 =
    canvas.toDataURL(
      "image/jpeg",
      0.55
    );


  // ===================================================
  // PREVIEW
  // ===================================================

  document
    .getElementById(
      "previewImage"
    )
    .src =
      fotoBase64;


  document
    .getElementById(
      "preview"
    )
    .classList
    .add("show");


  document
    .getElementById(
      "saveBtn"
    )
    .disabled =
      false;


  showMessage(
    "Foto berhasil diambil. Silakan simpan.",
    "success"
  );


  // Matikan kamera

  hentikanKamera();


  window.scrollTo({

    top:
      document
        .getElementById(
          "preview"
        )
        .offsetTop - 20,

    behavior:
      "smooth"

  });

}


// =========================================================
// SIMPAN FOTO
// =========================================================

async function simpanFoto() {

  if (!pesertaTerpilih) {

    showMessage(
      "Silakan pilih nama peserta.",
      "error"
    );

    return;

  }


  if (!fotoBase64) {

    showMessage(
      "Silakan ambil foto terlebih dahulu.",
      "error"
    );

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    "⏳ Menyimpan foto...";


  showMessage(
    "Sedang menyimpan foto...",
    "success"
  );


  try {

    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "simpanFotoDatang",

              id:
                pesertaTerpilih.id,

              nama:
                pesertaTerpilih.nama,

              foto:
                fotoBase64

            })

        }

      );


    if (!response.ok) {

      throw new Error(
        "HTTP error " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal menyimpan foto."
      );

    }


    // ===================================================
    // BERHASIL
    // ===================================================

    saveBtn.textContent =
      "✓ Berhasil Disimpan";


    showMessage(

      "✓ Absensi berhasil disimpan untuk " +
      pesertaTerpilih.nama,

      "success"

    );


    // Update status lokal

    const index =
      peserta.findIndex(
        function(item) {

          return String(
            item.id
          ) === String(
            pesertaTerpilih.id
          );

        }
      );


    if (
      index !== -1
    ) {

      peserta[index]
        .sudahDatang =
          true;


      peserta[index]
        .jamDatang =
          result.waktu || "";

    }


    // Reset

    setTimeout(
      function() {

        resetAbsensi();

      },
      1200
    );


  } catch (error) {

    console.error(error);


    saveBtn.disabled =
      false;


    saveBtn.textContent =
      "💾 Simpan Kehadiran";


    showMessage(

      error.message ||
      "Gagal menyimpan foto.",

      "error"

    );

  }

}


// =========================================================
// STOP CAMERA
// =========================================================

function hentikanKamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (video) {

    video.srcObject =
      null;

  }

}


// =========================================================
// RESET
// =========================================================

function resetAbsensi() {

  hentikanKamera();


  pesertaTerpilih =
    null;


  fotoBase64 =
    null;


  document
    .getElementById(
      "selectedName"
    )
    .textContent =
      "";


  document
    .getElementById(
      "search"
    )
    .value =
      "";


  document
    .getElementById(
      "selectedBox"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "cameraSection"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "preview"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "previewImage"
    )
    .src =
      "";


  document
    .getElementById(
      "saveBtn"
    )
    .disabled =
      true;


  document
    .getElementById(
      "saveBtn"
    )
    .textContent =
      "💾 Simpan Kehadiran";


  hideMessage();


  tampilkanNama(
    peserta
  );


  window.scrollTo({

    top:
      0,

    behavior:
      "smooth"

  });

}


// =========================================================
// MESSAGE
// =========================================================

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message show " +
    type;

}


function hideMessage() {

  const message =
    document.getElementById(
      "message"
    );


  message.className =
    "message";

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : text;


  return div.innerHTML;

}

// STOP CAMERA

window.addEventListener(

  "beforeunload",

  function() {

    hentikanKamera();

  }

);

</script>
