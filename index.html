<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Acara</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-top: 8px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #searchInput {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #555;
    }

    #participantCount {
      margin-top: 10px;
      margin-bottom: 10px;
      color: #777;
      font-size: 13px;
    }

    #participantList {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .participant {
      padding: 15px;
      border: 1px solid #e4e4e4;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      background: white;
      transition: 0.15s;
    }

    .participant:hover {
      background: #f5f5f5;
    }

    .participant:active {
      transform: scale(0.99);
    }

    .participant-name {
      font-size: 16px;
      font-weight: bold;
    }

    .participant-status {
      margin-top: 5px;
      font-size: 13px;
      color: #777;
    }

    .participant.disabled {
      opacity: 0.55;
      background: #f7f7f7;
      cursor: not-allowed;
    }

    #selectedBox {
      display: none;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    #selectedBox strong {
      display: block;
      margin-bottom: 5px;
    }

    #selectedName {
      font-size: 17px;
      font-weight: bold;
    }

    #cameraSection {
      display: none;
      margin-top: 10px;
    }

    #video {
      width: 100%;
      display: block;
      background: #000;
      border-radius: 12px;
    }

    #preview {
      width: 100%;
      display: none;
      margin-top: 10px;
      border-radius: 12px;
    }

    #canvas {
      display: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #takePhotoBtn {
      background: #333;
      color: white;
    }

    #submitBtn {
      background: #111;
      color: white;
    }

    #resetBtn {
      background: #e9e9e9;
      color: #222;
      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      display: block !important;
      background: #ffebee;
      color: #c62828;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      Absensi Acara
    </h1>

    <div class="subtitle">
      Pilih nama dan ambil foto
    </div>


    <label for="searchInput">
      Pilih Nama Peserta
    </label>

    <input
      type="text"
      id="searchInput"
      placeholder="Ketik untuk mencari nama..."
      autocomplete="off"
    >

    <div id="participantCount">
      Memuat peserta...
    </div>


    <div id="participantList">

      <div class="loading">
        Memuat daftar nama...
      </div>

    </div>


    <div id="selectedBox">

      <strong>
        Nama terpilih:
      </strong>

      <span id="selectedName"></span>

    </div>


    <div id="cameraSection">

      <label>
        Foto Kehadiran
      </label>

      <video
        id="video"
        autoplay
        playsinline
      ></video>

      <canvas id="canvas"></canvas>

      <img
        id="preview"
        alt="Preview foto"
      >

      <button
        id="takePhotoBtn"
        onclick="ambilFoto()"
      >
        📷 Ambil Foto
      </button>

      <button
        id="submitBtn"
        onclick="submitAbsensi()"
        disabled
      >
        ✓ Absen
      </button>

    </div>


    <div id="message"></div>


    <button
      id="resetBtn"
      onclick="resetForm()"
    >
      Pilih Nama Lain
    </button>

  </div>

</div>


<script>

  // =================================================
  // URL APPS SCRIPT
  // =================================================

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxbdqh0t_tE8JovVB9tYK7ya1RtaiQTrc5CI2zlSFj0GG3HJXyQR4ot1wRWibAIJTI0/exec";


  // =================================================
  // VARIABLE
  // =================================================

  let pesertaList = [];

  let pesertaTerpilih = null;

  let streamCamera = null;

  let fotoBase64 = null;


  // =================================================
  // LOAD PESERTA
  // =================================================

  function loadPeserta() {

    const list =
      document.getElementById("participantList");

    const count =
      document.getElementById("participantCount");


    list.innerHTML =
      '<div class="loading">' +
      'Memuat daftar nama...' +
      '</div>';

    count.textContent =
      "Memuat peserta...";


    fetch(
      APPS_SCRIPT_URL +
      "?action=daftarPeserta"
    )

    .then(function(response) {

      console.log(
        "HTTP Status:",
        response.status
      );

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      return response.json();

    })

    .then(function(result) {

      console.log(
        "Apps Script response:",
        result
      );

      if (
        !result ||
        result.success !== true
      ) {

        throw new Error(
          result?.message ||
          "Response Apps Script tidak valid."
        );

      }

      pesertaList =
        result.data || [];

      tampilkanPeserta(
        pesertaList
      );

    })

    .catch(function(error) {

      console.error(
        "ERROR LOAD PESERTA:",
        error
      );

      list.innerHTML =
        '<div class="empty">' +
        'Gagal memuat daftar nama.' +
        '</div>';

      count.textContent = "";

      showMessage(
        "Tidak dapat terhubung ke Apps Script. Cek Console untuk detail error.",
        "error"
      );

    });

  }


  // =================================================
  // LOAD SAAT HALAMAN DIBUKA
  // =================================================

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadPeserta();

    }
  );


  // =================================================
  // SEARCH
  // =================================================

  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      function() {

        const keyword =
          this.value
            .toLowerCase()
            .trim();


        if (!keyword) {

          tampilkanPeserta(
            pesertaList
          );

          return;

        }


        const hasil =
          pesertaList.filter(
            function(peserta) {

              return peserta.nama
                .toLowerCase()
                .includes(keyword);

            }
          );


        tampilkanPeserta(
          hasil
        );

      }
    );


  // =================================================
  // TAMPILKAN PESERTA
  // =================================================

  function tampilkanPeserta(list) {

    const container =
      document.getElementById(
        "participantList"
      );

    const count =
      document.getElementById(
        "participantCount"
      );


    container.innerHTML = "";


    const total =
      list.length;


    const sudahAbsen =
      list.filter(
        function(peserta) {

          return peserta.sudahDatang;

        }
      ).length;


    count.textContent =
      total +
      " nama ditampilkan • " +
      sudahAbsen +
      " sudah absen";


    if (total === 0) {

      container.innerHTML =
        '<div class="empty">' +
        'Nama peserta tidak ditemukan.' +
        '</div>';

      return;

    }


    list.forEach(
      function(peserta) {

        const item =
          document.createElement("div");


        item.className =
          "participant";


        if (peserta.sudahDatang) {

          item.classList.add(
            "disabled"
          );

        }


        const status =
          peserta.sudahDatang
            ? "✓ Sudah absen"
            : "Belum absen";


        item.innerHTML =

          '<div class="participant-name">' +

          escapeHtml(
            peserta.nama
          ) +

          '</div>' +

          '<div class="participant-status">' +

          status +

          '</div>';


        item.onclick =
          function() {

            pilihPeserta(
              peserta
            );

          };


        container.appendChild(
          item
        );

      }
    );

  }


  // =================================================
  // PILIH PESERTA
  // =================================================

  function pilihPeserta(peserta) {

    if (peserta.sudahDatang) {

      showMessage(
        peserta.nama +
        " sudah melakukan absensi.",
        "error"
      );

      return;

    }


    pesertaTerpilih =
      peserta;


    fotoBase64 = null;


    document
      .getElementById("selectedName")
      .textContent =
      peserta.nama;


    document
      .getElementById("selectedBox")
      .style.display =
      "block";


    document
      .getElementById("cameraSection")
      .style.display =
      "block";


    const preview =
      document.getElementById(
        "preview"
      );


    preview.src = "";

    preview.style.display =
      "none";


    document
      .getElementById("submitBtn")
      .disabled = true;


    document
      .getElementById("submitBtn")
      .textContent =
      "✓ Absen";


    hideMessage();


    bukaKamera();


    setTimeout(
      function() {

        document
          .getElementById(
            "cameraSection"
          )
          .scrollIntoView({
            behavior: "smooth"
          });

      },
      300
    );

  }


  // =================================================
  // BUKA KAMERA BELAKANG
  // =================================================

  async function bukaKamera() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showMessage(
        "Browser tidak mendukung kamera.",
        "error"
      );

      return;

    }


    stopCamera();


    try {

      /*
       * LANGKAH 1
       * Minta kamera belakang secara langsung.
       */

      let stream;

      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode: {
                  exact: "environment"
                }
              },

              audio: false

            });

      } catch (error) {

        console.warn(
          "exact environment gagal:",
          error
        );


        /*
         * LANGKAH 2
         * Minta akses kamera terlebih dahulu.
         * Setelah izin diberikan, kita bisa
         * melihat daftar device kamera.
         */

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: true,

              audio: false

            });

      }


      /*
       * Simpan stream sementara.
       */

      stopCamera();


      /*
       * Ambil daftar semua kamera.
       */

      const devices =
        await navigator.mediaDevices
          .enumerateDevices();


      const cameras =
        devices.filter(
          function(device) {

            return device.kind ===
              "videoinput";

          }
        );


      console.log(
        "Daftar kamera:",
        cameras
      );


      /*
       * Cari kamera yang kemungkinan
       * merupakan kamera belakang.
       */

      const backCamera =
        cameras.find(
          function(camera) {

            const label =
              (camera.label || "")
                .toLowerCase();

            return (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment") ||
              label.includes("facing")
            );

          }
        );


      /*
       * Kalau kamera belakang ditemukan,
       * gunakan deviceId kamera tersebut.
       */

      if (backCamera) {

        console.log(
          "Kamera belakang ditemukan:",
          backCamera.label
        );


        /*
         * Matikan stream sementara.
         */

        stream.getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );


        /*
         * Buka kamera belakang
         * berdasarkan deviceId.
         */

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                deviceId: {
                  exact:
                    backCamera.deviceId
                }
              },

              audio: false

            });

      }


      /*
       * Simpan stream final.
       */

      streamCamera =
        stream;


      const video =
        document.getElementById(
          "video"
        );


      video.srcObject =
        stream;


      video.setAttribute(
        "playsinline",
        ""
      );


      video.setAttribute(
        "autoplay",
        ""
      );


      await video.play();


      /*
       * Cek kamera yang benar-benar
       * sedang digunakan.
       */

      const tracks =
        stream.getVideoTracks();


      if (tracks.length > 0) {

        const settings =
          tracks[0].getSettings();

        console.log(
          "Kamera aktif:",
          settings
        );

      }


    } catch (error) {

      console.error(
        "Camera error:",
        error
      );


      showMessage(
        "Kamera belakang tidak bisa dibuka. Pastikan izin kamera sudah diberikan.",
        "error"
      );

    }

  }


  // =================================================
  // AMBIL FOTO
  // =================================================

  function ambilFoto() {

    if (!pesertaTerpilih) {

      showMessage(
        "Pilih nama peserta terlebih dahulu.",
        "error"
      );

      return;

    }


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      !width ||
      !height
    ) {

      showMessage(
        "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
        "error"
      );

      return;

    }


    canvas.width =
      width;


    canvas.height =
      height;


    const context =
      canvas.getContext("2d");


    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    fotoBase64 =
      canvas.toDataURL(
        "image/jpeg",
        0.75
      );


    const preview =
      document.getElementById(
        "preview"
      );


    preview.src =
      fotoBase64;


    preview.style.display =
      "block";


    document
      .getElementById(
        "submitBtn"
      )
      .disabled =
      false;


    showMessage(
      "Foto berhasil diambil. Klik Absen untuk menyimpan.",
      "success"
    );

  }


  // =================================================
  // SUBMIT ABSENSI
  // =================================================

  function submitAbsensi() {

    if (!pesertaTerpilih) {

      showMessage(
        "Peserta belum dipilih.",
        "error"
      );

      return;

    }


    if (!fotoBase64) {

      showMessage(
        "Silakan ambil foto terlebih dahulu.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "submitBtn"
      );


    button.disabled = true;

    button.textContent =
      "Menyimpan...";


    const data = {

      action:
        "simpanFotoDatang",

      id:
        pesertaTerpilih.id,

      nama:
        pesertaTerpilih.nama,

      foto:
        fotoBase64

    };


    console.log(
      "Mengirim:",
      pesertaTerpilih.id,
      pesertaTerpilih.nama
    );


    fetch(
      APPS_SCRIPT_URL,
      {

        method: "POST",

        body:
          JSON.stringify(data)

      }
    )

    .then(
      function(response) {

        console.log(
          "POST status:",
          response.status
        );

        return response.json();

      }
    )

    .then(
      function(result) {

        console.log(
          "POST response:",
          result
        );


        if (result.success) {

          showMessage(
            "✓ Absensi " +
            pesertaTerpilih.nama +
            " berhasil!",
            "success"
          );


          stopCamera();


          pesertaTerpilih.sudahDatang =
            true;


          setTimeout(
            function() {

              resetForm();

              loadPeserta();

            },
            1500
          );


        } else {

          showMessage(
            result.message ||
            "Absensi gagal.",
            "error"
          );


          button.disabled =
            false;


          button.textContent =
            "✓ Absen";

        }

      }
    )

    .catch(
      function(error) {

        console.error(
          "POST ERROR:",
          error
        );


        showMessage(
          "Gagal mengirim absensi.",
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "✓ Absen";

      }
    );

  }


  // =================================================
  // STOP CAMERA
  // =================================================

  function stopCamera() {

    if (streamCamera) {

      streamCamera
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      streamCamera =
        null;

    }


    const video =
      document.getElementById(
        "video"
      );


    if (video) {

      video.srcObject =
        null;

    }

  }


  // =================================================
  // RESET
  // =================================================

  function resetForm() {

    stopCamera();


    pesertaTerpilih =
      null;


    fotoBase64 =
      null;


    document
      .getElementById(
        "searchInput"
      )
      .value = "";


    document
      .getElementById(
        "selectedBox"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "cameraSection"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "preview"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "preview"
      )
      .src = "";


    document
      .getElementById(
        "submitBtn"
      )
      .disabled =
      true;


    document
      .getElementById(
        "submitBtn"
      )
      .textContent =
      "✓ Absen";


    hideMessage();


    tampilkanPeserta(
      pesertaList
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // =================================================
  // MESSAGE
  // =================================================

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.className =
      type;


    message.style.display =
      "block";

  }


  function hideMessage() {

    const message =
      document.getElementById(
        "message"
      );


    message.style.display =
      "none";


    message.className =
      "";

  }


  // =================================================
  // ESCAPE HTML
  // =================================================

  function escapeHtml(text) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }


</script>


</body>

</html>
