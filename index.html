<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Absensi Acara</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #4a73e8;
    }

    .name-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .name-item {
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      transition: 0.15s;
    }

    .name-item:hover {
      background: #f0f4ff;
    }

    .name-item.disabled {
      background: #f3f3f3;
      color: #999;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      padding: 18px;
      color: #888;
      border: 1px dashed #ddd;
      border-radius: 8px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    /* TAMBAH NAMA */

    .add-box {
      display: none;
      padding: 15px;
      border-radius: 10px;
      background: #fff8e6;
      border: 1px solid #f0d58a;
      margin-bottom: 20px;
    }

    .add-box.show {
      display: block;
    }

    .add-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .add-description {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    /* SELECTED */

    .selected-box {
      display: none;
      padding: 15px;
      background: #f5f7ff;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .selected-box.show {
      display: block;
    }

    .selected-name {
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
    }

    /* CAMERA */

    .camera-section {
      display: none;
      margin-top: 20px;
    }

    .camera-section.show {
      display: block;
    }

    .camera-info {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    video {
      width: 100%;
      min-height: 250px;
      border-radius: 10px;
      background: #000;
      display: block;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    /* PREVIEW */

    .preview {
      display: none;
      margin-top: 15px;
    }

    .preview.show {
      display: block;
    }

    .preview img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    /* BUTTON */

    button {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-add {
      background: #f0a500;
      color: #fff;
    }

    .btn-capture {
      background: #4a73e8;
      color: #fff;
    }

    .btn-save {
      background: #20a464;
      color: #fff;
    }

    .btn-reset {
      background: #ddd;
      color: #222;
    }

    .btn-retry {
      background: #4a73e8;
      color: #fff;
    }

    /* MESSAGE */

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e7f7ee;
      color: #167342;
    }

    .message.error {
      background: #fdeaea;
      color: #b42318;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    Absensi Acara
  </h1>

  <div class="subtitle">
    Pilih nama dan ambil foto
  </div>


  <!-- ==================================================
       SEARCH
       ================================================== -->

  <label for="search">
    Cari Nama Peserta
  </label>

  <input
    type="text"
    id="search"
    placeholder="Ketik nama..."
    autocomplete="off"
    oninput="filterNama()"
  >


  <!-- ==================================================
       DAFTAR PESERTA
       ================================================== -->

  <div
    id="nameList"
    class="name-list"
  >

    <div class="loading">
      Memuat daftar peserta...
    </div>

  </div>


  <!-- ==================================================
       TAMBAH NAMA
       ================================================== -->

  <div
    id="addBox"
    class="add-box show"
  >

    <div class="add-title">
      Tidak menemukan nama?
    </div>

    <div class="add-description">
      Ketik nama di kolom pencarian,
      lalu tambahkan sebagai peserta baru.
    </div>

    <button
      type="button"
      class="btn-add"
      onclick="tampilkanFormTambah()"
    >
      ➕ Tambah Nama Baru
    </button>

  </div>


  <!-- ==================================================
       NAMA TERPILIH
       ================================================== -->

  <div
    id="selectedBox"
    class="selected-box"
  >

    <div>
      Nama terpilih:
    </div>

    <div
      id="selectedName"
      class="selected-name"
    ></div>

  </div>


  <!-- ==================================================
       CAMERA
       ================================================== -->

  <div
    id="cameraSection"
    class="camera-section"
  >

    <label>
      Foto Kehadiran
    </label>

    <div class="camera-info">
      📷 Kamera belakang • HD
    </div>

    <video
      id="video"
      autoplay
      playsinline
    ></video>

    <canvas
      id="canvas"
    ></canvas>


    <button
      type="button"
      id="captureBtn"
      class="btn-capture"
      onclick="ambilFoto()"
    >
      📸 Ambil Foto
    </button>


    <!-- PREVIEW -->

    <div
      id="preview"
      class="preview"
    >

      <img
        id="previewImage"
        alt="Preview foto"
      >

    </div>


    <!-- SIMPAN -->

    <button
      type="button"
      id="saveBtn"
      class="btn-save"
      onclick="simpanFoto()"
      disabled
    >
      💾 Simpan Kehadiran
    </button>


    <!-- RESET -->

    <button
      type="button"
      class="btn-reset"
      onclick="resetAbsensi()"
    >
      ↩️ Pilih Nama Lain
    </button>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>

</div>


<script>


// ========================================================
// CONFIG
// ========================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxbdqh0t_tE8JovVB9tYK7ya1RtaiQTrc5CI2zlSFj00G3HJXyQR4ot1wRWibAIJTI0/exec";


// ========================================================
// VARIABLES
// ========================================================

let peserta = [];

let pesertaTerpilih = null;

let fotoBase64 = null;

let stream = null;


// ========================================================
// LOAD PESERTA
// ========================================================

window.onload = function() {

  loadPeserta();

};


async function loadPeserta() {

  const list =
    document.getElementById(
      "nameList"
    );


  list.innerHTML =
    '<div class="loading">Memuat peserta...</div>';


  try {

    const result =
      await requestWithRetry(

        API_URL +
        "?action=daftarPeserta",

        {
          method: "GET"
        },

        3

      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengambil daftar peserta."
      );

    }


    peserta =
      result.data || [];


    tampilkanNama(
      peserta
    );


  } catch (error) {

    console.error(error);


    list.innerHTML = `

      <div class="empty">

        Gagal memuat peserta.<br><br>

        <button
          type="button"
          class="btn-retry"
          onclick="loadPeserta()"
        >
          🔄 Coba Lagi
        </button>

      </div>

    `;


    showMessage(
      "Koneksi ke server bermasalah. Silakan coba lagi.",
      "error"
    );

  }

}


// ========================================================
// REQUEST DENGAN RETRY
// ========================================================

async function requestWithRetry(
  url,
  options,
  maxRetry
) {

  let lastError;


  for (
    let attempt = 1;
    attempt <= maxRetry;
    attempt++
  ) {

    try {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          function() {

            controller.abort();

          },
          30000
        );


      const response =
        await fetch(

          url,

          {

            ...options,

            signal:
              controller.signal

          }

        );


      clearTimeout(
        timeout
      );


      if (!response.ok) {

        throw new Error(
          "Server mengembalikan HTTP " +
          response.status
        );

      }


      const result =
        await response.json();


      return result;


    } catch (error) {

      lastError =
        error;


      console.log(
        "Percobaan " +
        attempt +
        " gagal:",
        error
      );


      if (
        attempt <
        maxRetry
      ) {

        await sleep(
          800 * attempt
        );

      }

    }

  }


  throw lastError;

}


// ========================================================
// SLEEP
// ========================================================

function sleep(
  ms
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


// ========================================================
// TAMPILKAN NAMA
// ========================================================

function tampilkanNama(
  data
) {

  const list =
    document.getElementById(
      "nameList"
    );


  const addBox =
    document.getElementById(
      "addBox"
    );


  list.innerHTML = "";


  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">
        Nama tidak ditemukan.
      </div>

    `;

  }


  if (
    data &&
    data.length > 0
  ) {

    data.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "name-item";


        if (
          item.sudahDatang
        ) {

          div.classList.add(
            "disabled"
          );

        }


        let status = "";


        if (
          item.sudahDatang
        ) {

          status = `

            <div class="status">

              ✓ Sudah hadir

              ${
                item.jamDatang
                  ? "• " +
                    escapeHtml(
                      String(
                        item.jamDatang
                      )
                    )
                  : ""
              }

            </div>

          `;

        }


        div.innerHTML = `

          <div>
            ${escapeHtml(
              item.nama
            )}
          </div>

          ${status}

        `;


        if (
          !item.sudahDatang
        ) {

          div.onclick =
            function() {

              pilihPeserta(
                item
              );

            };

        }


        list.appendChild(
          div
        );

      }
    );

  }


  // Selalu tampilkan tombol
  // tambah nama

  addBox.classList.add(
    "show"
  );


  addBox.innerHTML = `

    <div class="add-title">
      Tidak menemukan nama?
    </div>

    <div class="add-description">
      Ketik nama di kolom pencarian,
      lalu tambahkan sebagai peserta baru.
    </div>

    <button
      type="button"
      class="btn-add"
      onclick="tampilkanFormTambah()"
    >
      ➕ Tambah Nama Baru
    </button>

  `;

}


// ========================================================
// FILTER NAMA
// ========================================================

function filterNama() {

  const keyword =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase()
      .trim();


  if (!keyword) {

    tampilkanNama(
      peserta
    );

    return;

  }


  const hasil =
    peserta.filter(
      function(item) {

        return String(
          item.nama
        )
          .toLowerCase()
          .includes(
            keyword
          );

      }
    );


  tampilkanNama(
    hasil
  );

}


// ========================================================
// FORM TAMBAH NAMA
// ========================================================

function tampilkanFormTambah() {

  const search =
    document.getElementById(
      "search"
    );


  const nama =
    search.value.trim();


  if (!nama) {

    showMessage(
      "Ketik nama peserta terlebih dahulu.",
      "error"
    );


    search.focus();


    return;

  }


  // Cek apakah sudah ada

  const sudahAda =
    peserta.some(
      function(item) {

        return String(
          item.nama
        )
          .trim()
          .toLowerCase() ===
          nama.toLowerCase();

      }
    );


  if (sudahAda) {

    showMessage(
      "Nama tersebut sudah ada di daftar.",
      "error"
    );


    return;

  }


  const lanjut =
    confirm(
      'Tambahkan peserta dengan nama "' +
      nama +
      '"?'
    );


  if (!lanjut) {

    return;

  }


  tambahPesertaBaru(
    nama
  );

}


// ========================================================
// TAMBAH PESERTA
// ========================================================

async function tambahPesertaBaru(
  nama
) {

  const addBox =
    document.getElementById(
      "addBox"
    );


  addBox.innerHTML = `

    <div class="add-title">
      ⏳ Menambahkan peserta...
    </div>

    <div class="add-description">
      Tunggu sebentar.
    </div>

  `;


  try {

    const result =
      await requestWithRetry(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "tambahPeserta",

              nama:
                nama

            })

        },

        3

      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal menambahkan peserta."
      );

    }


    const pesertaBaru = {

      id:
        String(
          result.id
        ),

      nama:
        result.nama,

      sudahDatang:
        false,

      jamDatang:
        ""

    };


    peserta.push(
      pesertaBaru
    );


    pesertaTerpilih =
      pesertaBaru;


    fotoBase64 =
      null;


    document
      .getElementById(
        "selectedName"
      )
      .textContent =
        pesertaBaru.nama;


    document
      .getElementById(
        "selectedBox"
      )
      .classList
      .add(
        "show"
      );


    document
      .getElementById(
        "cameraSection"
      )
      .classList
      .add(
        "show"
      );


    document
      .getElementById(
        "preview"
      )
      .classList
      .remove(
        "show"
      );


    document
      .getElementById(
        "saveBtn"
      )
      .disabled =
        true;


    document
      .getElementById(
        "saveBtn"
      )
      .textContent =
        "💾 Simpan Kehadiran";


    document
      .getElementById(
        "search"
      )
      .value =
        "";


    addBox.classList.remove(
      "show"
    );


    showMessage(
      "Nama berhasil ditambahkan. Membuka kamera...",
      "success"
    );


    await bukaKamera();


    scrollToCamera();


  } catch (error) {

    console.error(error);


    addBox.classList.add(
      "show"
    );


    addBox.innerHTML = `

      <div class="add-title">
        ❌ Gagal menambahkan nama
      </div>

      <div class="add-description">
        ${escapeHtml(
          error.message ||
          "Terjadi kesalahan."
        )}
      </div>

      <button
        type="button"
        class="btn-add"
        onclick="tampilkanFormTambah()"
      >
        ➕ Coba Lagi
      </button>

    `;

  }

}


// ========================================================
// PILIH PESERTA
// ========================================================

async function pilihPeserta(
  item
) {

  if (
    item.sudahDatang
  ) {

    return;

  }


  hentikanKamera();


  pesertaTerpilih =
    item;


  fotoBase64 =
    null;


  document
    .getElementById(
      "selectedName"
    )
    .textContent =
      item.nama;


  document
    .getElementById(
      "selectedBox"
    )
    .classList
    .add(
      "show"
    );


  document
    .getElementById(
      "cameraSection"
    )
    .classList
    .add(
      "show"
    );


  document
    .getElementById(
      "preview"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "saveBtn"
    )
    .disabled =
      true;


  document
    .getElementById(
      "saveBtn"
    )
    .textContent =
      "💾 Simpan Kehadiran";


  await bukaKamera();


  scrollToCamera();

}


// ========================================================
// SCROLL KE CAMERA
// ========================================================

function scrollToCamera() {

  const camera =
    document.getElementById(
      "cameraSection"
    );


  window.scrollTo({

    top:
      camera.offsetTop - 20,

    behavior:
      "smooth"

  });

}


// ========================================================
// KAMERA BELAKANG
// ========================================================

async function bukaKamera() {

  hentikanKamera();


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices
      .getUserMedia
  ) {

    showMessage(
      "Browser tidak mendukung kamera.",
      "error"
    );


    return false;

  }


  try {

    /*
     * Kamera belakang.
     *
     * Resolusi yang diminta:
     * 1920 x 1080
     */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {

              exact:
                "environment"

            },

            width: {

              ideal:
                1920

            },

            height: {

              ideal:
                1080

            }

          },

          audio:
            false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    await video.play();


    const track =
      stream
        .getVideoTracks()[0];


    const settings =
      track.getSettings();


    console.log(
      "Camera settings:",
      settings
    );


    console.log(
      "Resolution:",
      settings.width,
      "x",
      settings.height
    );


    if (
      settings.facingMode &&
      settings.facingMode !==
        "environment"
    ) {

      hentikanKamera();


      showMessage(
        "Kamera belakang tidak berhasil dipilih.",
        "error"
      );


      return false;

    }


    hideMessage();


    return true;


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    hentikanKamera();


    showMessage(
      "Kamera belakang tidak dapat dibuka. Pastikan izin kamera sudah diberikan.",
      "error"
    );


    return false;

  }

}


// ========================================================
// AMBIL FOTO
// ========================================================

function ambilFoto() {

  if (!stream) {

    showMessage(
      "Kamera belum aktif.",
      "error"
    );


    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const context =
    canvas.getContext(
      "2d"
    );


  /*
   * Maksimal 1600 px.
   *
   * Lebih tajam daripada
   * versi sebelumnya.
   */

  const MAX_SIZE =
    1600;


  let width =
    video.videoWidth;


  let height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    showMessage(
      "Kamera belum siap. Tunggu sebentar lalu coba lagi.",
      "error"
    );


    return;

  }


  // ======================================================
  // RESIZE
  // ======================================================

  if (
    width > height
  ) {

    // Landscape

    if (
      width > MAX_SIZE
    ) {

      height =
        Math.round(
          height *
          MAX_SIZE /
          width
        );


      width =
        MAX_SIZE;

    }

  } else {

    // Portrait

    if (
      height > MAX_SIZE
    ) {

      width =
        Math.round(
          width *
          MAX_SIZE /
          height
        );


      height =
        MAX_SIZE;

    }

  }


  canvas.width =
    width;


  canvas.height =
    height;


  // ======================================================
  // DRAW FOTO
  // ======================================================

  context.drawImage(

    video,

    0,
    0,

    width,
    height

  );


  // ======================================================
  // JPEG QUALITY
  // ======================================================

  fotoBase64 =
    canvas.toDataURL(

      "image/jpeg",

      0.75

    );


  // ======================================================
  // PREVIEW
  // ======================================================

  document
    .getElementById(
      "previewImage"
    )
    .src =
      fotoBase64;


  document
    .getElementById(
      "preview"
    )
    .classList
    .add(
      "show"
    );


  document
    .getElementById(
      "saveBtn"
    )
    .disabled =
      false;


  showMessage(
    "Foto berhasil diambil. Silakan simpan.",
    "success"
  );


  // Matikan kamera

  hentikanKamera();


  window.scrollTo({

    top:
      document
        .getElementById(
          "preview"
        )
        .offsetTop - 20,

    behavior:
      "smooth"

  });

}


// ========================================================
// SIMPAN FOTO
// ========================================================

async function simpanFoto() {

  if (!pesertaTerpilih) {

    showMessage(
      "Silakan pilih peserta.",
      "error"
    );


    return;

  }


  if (!fotoBase64) {

    showMessage(
      "Silakan ambil foto terlebih dahulu.",
      "error"
    );


    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    "⏳ Menyimpan foto...";


  showMessage(
    "Sedang menyimpan foto...",
    "success"
  );


  try {

    const result =
      await requestWithRetry(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "simpanFotoDatang",

              id:
                pesertaTerpilih.id,

              nama:
                pesertaTerpilih.nama,

              foto:
                fotoBase64

            })

        },

        3

      );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal menyimpan absensi."
      );

    }


    // ==================================================
    // BERHASIL
    // ==================================================

    saveBtn.textContent =
      "✓ Berhasil Disimpan";


    showMessage(

      "✓ Absensi berhasil disimpan untuk " +
      pesertaTerpilih.nama,

      "success"

    );


    // ==================================================
    // UPDATE LOKAL
    // ==================================================

    const index =
      peserta.findIndex(
        function(item) {

          return String(
            item.id
          ) ===
          String(
            pesertaTerpilih.id
          );

        }
      );


    if (
      index !== -1
    ) {

      peserta[index]
        .sudahDatang =
          true;


      peserta[index]
        .jamDatang =
          result.waktu ||
          "";

    }


    // ==================================================
    // RESET
    // ==================================================

    setTimeout(

      function() {

        resetAbsensi();

      },

      1200

    );


  } catch (error) {

    console.error(error);


    saveBtn.disabled =
      false;


    saveBtn.textContent =
      "💾 Simpan Kehadiran";


    showMessage(

      error.message ||
      "Gagal menyimpan foto.",

      "error"

    );

  }

}


// ========================================================
// STOP CAMERA
// ========================================================

function hentikanKamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (video) {

    video.srcObject =
      null;

  }

}


// ========================================================
// RESET
// ========================================================

function resetAbsensi() {

  hentikanKamera();


  pesertaTerpilih =
    null;


  fotoBase64 =
    null;


  document
    .getElementById(
      "selectedName"
    )
    .textContent =
      "";


  document
    .getElementById(
      "search"
    )
    .value =
      "";


  document
    .getElementById(
      "selectedBox"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "cameraSection"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "preview"
    )
    .classList
    .remove(
      "show"
    );


  document
    .getElementById(
      "previewImage"
    )
    .src =
      "";


  document
    .getElementById(
      "saveBtn"
    )
    .disabled =
      true;


  document
    .getElementById(
      "saveBtn"
    )
    .textContent =
      "💾 Simpan Kehadiran";


  hideMessage();


  tampilkanNama(
    peserta
  );


  window.scrollTo({

    top: 0,

    behavior:
      "smooth"

  });

}


// ========================================================
// MESSAGE
// ========================================================

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message show " +
    type;

}


function hideMessage() {

  const message =
    document.getElementById(
      "message"
    );


  message.className =
    "message";

}


// ========================================================
// ESCAPE HTML
// ========================================================

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : text;


  return div.innerHTML;

}


// ========================================================
// STOP CAMERA
// ========================================================

window.addEventListener(

  "beforeunload",

  function() {

    hentikanKamera();

  }

);

</script>
