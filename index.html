<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Absensi Acara</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-top: 8px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #searchInput {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #333;
    }

    #participantList {
      margin-top: 12px;
      max-height: 280px;
      overflow-y: auto;
    }

    .participant {
      padding: 14px;
      border: 1px solid #e3e3e3;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      background: white;
    }

    .participant:hover {
      background: #f4f4f4;
    }

    .participant-name {
      font-weight: bold;
      font-size: 16px;
    }

    .participant-status {
      margin-top: 4px;
      font-size: 13px;
      color: #777;
    }

    .participant.disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .selected-box {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    .selected-box strong {
      display: block;
      margin-bottom: 5px;
    }

    #cameraSection {
      display: none;
      margin-top: 20px;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: black;
      display: block;
    }

    #preview {
      width: 100%;
      border-radius: 12px;
      display: none;
      margin-top: 10px;
    }

    canvas {
      display: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #takePhotoBtn {
      background: #333;
      color: white;
    }

    #submitBtn {
      background: #111;
      color: white;
    }

    #resetBtn {
      background: #e9e9e9;
      color: #222;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Absensi Acara</h1>

    <div class="subtitle">
      Pilih nama dan ambil foto
    </div>


    <!-- ============================= -->
    <!-- SEARCH NAMA -->
    <!-- ============================= -->

    <label for="searchInput">
      Cari Nama Peserta
    </label>

    <input
      type="text"
      id="searchInput"
      placeholder="Ketik nama peserta..."
      autocomplete="off"
    >


    <!-- ============================= -->
    <!-- DAFTAR PESERTA -->
    <!-- ============================= -->

    <div id="participantList">

      <div class="loading">
        Memuat peserta...
      </div>

    </div>


    <!-- ============================= -->
    <!-- PESERTA TERPILIH -->
    <!-- ============================= -->

    <div
      id="selectedBox"
      class="selected-box"
    >

      <strong>
        Nama terpilih:
      </strong>

      <span id="selectedName"></span>

    </div>


    <!-- ============================= -->
    <!-- CAMERA -->
    <!-- ============================= -->

    <div id="cameraSection">

      <label>
        Foto Kehadiran
      </label>

      <video
        id="video"
        autoplay
        playsinline>
      </video>

      <canvas id="canvas"></canvas>

      <img
        id="preview"
        alt="Preview foto"
      >

      <button
        id="takePhotoBtn"
        onclick="ambilFoto()"
      >
        📷 Ambil Foto
      </button>

      <button
        id="submitBtn"
        onclick="submitAbsensi()"
        disabled
      >
        ✓ Absen
      </button>

    </div>


    <!-- ============================= -->
    <!-- MESSAGE -->
    <!-- ============================= -->

    <div
      id="message"
      class="message">
    </div>


    <!-- ============================= -->
    <!-- RESET -->
    <!-- ============================= -->

    <button
      id="resetBtn"
      onclick="resetForm()"
    >
      Pilih Nama Lain
    </button>

  </div>

</div>


<script>

  // ==================================================
  // URL APPS SCRIPT
  // ==================================================

  const APPS_SCRIPT_URL =
    "GANTI_DENGAN_URL_APPS_SCRIPT";


  // ==================================================
  // VARIABLE
  // ==================================================

  let pesertaList = [];

  let pesertaTerpilih = null;

  let streamCamera = null;

  let fotoBase64 = null;


  // ==================================================
  // SAAT HALAMAN DIBUKA
  // ==================================================

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadPeserta();

    }
  );


  // ==================================================
  // LOAD SEMUA PESERTA
  // ==================================================

  function loadPeserta() {

    const list =
      document.getElementById(
        "participantList"
      );


    list.innerHTML =
      '<div class="loading">' +
      'Memuat peserta...' +
      '</div>';


    fetch(
      APPS_SCRIPT_URL +
      "?action=daftarPeserta"
    )

    .then(function(response) {

      return response.json();

    })

    .then(function(result) {

      console.log(
        "Data peserta:",
        result
      );


      if (!result.success) {

        showMessage(
          result.message ||
          "Gagal mengambil data peserta.",
          "error"
        );

        return;

      }


      pesertaList =
        result.data || [];


      tampilkanPeserta(
        pesertaList
      );

    })

    .catch(function(error) {

      console.error(error);

      list.innerHTML =
        '<div class="empty">' +
        'Gagal memuat peserta.' +
        '</div>';


      showMessage(
        "Tidak dapat terhubung ke server.",
        "error"
      );

    });

  }


  // ==================================================
  // SEARCH
  // ==================================================

  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      function() {

        const keyword =
          this.value
            .toLowerCase()
            .trim();


        if (!keyword) {

          tampilkanPeserta(
            pesertaList
          );

          return;

        }


        const hasil =
          pesertaList.filter(
            function(peserta) {

              return peserta.nama
                .toLowerCase()
                .includes(keyword);

            }
          );


        tampilkanPeserta(
          hasil
        );

      }
    );


  // ==================================================
  // TAMPILKAN PESERTA
  // ==================================================

  function tampilkanPeserta(list) {

    const container =
      document.getElementById(
        "participantList"
      );


    container.innerHTML = "";


    if (
      !list ||
      list.length === 0
    ) {

      container.innerHTML =
        '<div class="empty">' +
        'Nama peserta tidak ditemukan.' +
        '</div>';

      return;

    }


    list.forEach(
      function(peserta) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "participant";


        if (peserta.sudahDatang) {

          item.classList.add(
            "disabled"
          );

        }


        const status =
          peserta.sudahDatang
            ? "✓ Sudah absen"
            : "Belum absen";


        item.innerHTML =

          '<div class="participant-name">' +
          escapeHtml(
            peserta.nama
          ) +
          '</div>' +

          '<div class="participant-status">' +
          status +
          '</div>';


        item.onclick =
          function() {

            pilihPeserta(
              peserta
            );

          };


        container.appendChild(
          item
        );

      }
    );

  }


  // ==================================================
  // PILIH PESERTA
  // ==================================================

  function pilihPeserta(
    peserta
  ) {

    if (peserta.sudahDatang) {

      showMessage(
        "Peserta ini sudah melakukan absensi.",
        "error"
      );

      return;

    }


    pesertaTerpilih =
      peserta;


    document
      .getElementById(
        "selectedName"
      )
      .textContent =
      peserta.nama;


    document
      .getElementById(
        "selectedBox"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "cameraSection"
      )
      .style.display =
      "block";


    bukaKamera();


    document
      .getElementById(
        "cameraSection"
      )
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  // ==================================================
  // BUKA KAMERA
  // ==================================================

  function bukaKamera() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showMessage(
        "Browser tidak mendukung kamera.",
        "error"
      );

      return;

    }


    navigator
      .mediaDevices
      .getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      })

      .then(
        function(stream) {

          streamCamera =
            stream;


          const video =
            document.getElementById(
              "video"
            );


          video.srcObject =
            stream;

        }
      )

      .catch(
        function(error) {

          console.error(
            error
          );


          showMessage(
            "Kamera tidak bisa dibuka. Silakan izinkan akses kamera.",
            "error"
          );

        }
      );

  }


  // ==================================================
  // AMBIL FOTO
  // ==================================================

  function ambilFoto() {

    if (!pesertaTerpilih) {

      showMessage(
        "Pilih nama peserta terlebih dahulu.",
        "error"
      );

      return;

    }


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if (
      width === 0 ||
      height === 0
    ) {

      showMessage(
        "Kamera belum siap. Tunggu sebentar.",
        "error"
      );

      return;

    }


    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    fotoBase64 =
      canvas.toDataURL(
        "image/jpeg",
        0.75
      );


    const preview =
      document.getElementById(
        "preview"
      );


    preview.src =
      fotoBase64;


    preview.style.display =
      "block";


    document
      .getElementById(
        "submitBtn"
      )
      .disabled =
      false;


    showMessage(
      "Foto berhasil diambil. Klik Absen untuk menyimpan.",
      "success"
    );

  }


  // ==================================================
  // SUBMIT ABSENSI
  // ==================================================

  function submitAbsensi() {

    if (!pesertaTerpilih) {

      showMessage(
        "Peserta belum dipilih.",
        "error"
      );

      return;

    }


    if (!fotoBase64) {

      showMessage(
        "Ambil foto terlebih dahulu.",
        "error"
      );

      return;

    }


    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    submitBtn.disabled =
      true;


    submitBtn.textContent =
      "Menyimpan...";


    const data = {

      action:
        "simpanFotoDatang",

      id:
        pesertaTerpilih.id,

      nama:
        pesertaTerpilih.nama,

      foto:
        fotoBase64

    };


    fetch(
      APPS_SCRIPT_URL,
      {

        method: "POST",

        body:
          JSON.stringify(data)

      }
    )

    .then(
      function(response) {

        return response.json();

      }
    )

    .then(
      function(result) {

        console.log(
          "Response:",
          result
        );


        if (result.success) {

          showMessage(
            "✓ Absensi " +
            pesertaTerpilih.nama +
            " berhasil!",
            "success"
          );


          stopCamera();


          setTimeout(
            function() {

              resetForm();

              loadPeserta();

            },
            1500
          );


        } else {

          showMessage(
            result.message ||
            "Absensi gagal.",
            "error"
          );


          submitBtn.disabled =
            false;


          submitBtn.textContent =
            "✓ Absen";

        }

      }
    )

    .catch(
      function(error) {

        console.error(
          error
        );


        showMessage(
          "Gagal mengirim data absensi.",
          "error"
        );


        submitBtn.disabled =
          false;


        submitBtn.textContent =
          "✓ Absen";

      }
    );

  }


  // ==================================================
  // STOP CAMERA
  // ==================================================

  function stopCamera() {

    if (streamCamera) {

      streamCamera
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      streamCamera =
        null;

    }

  }


  // ==================================================
  // RESET
  // ==================================================

  function resetForm() {

    stopCamera();


    pesertaTerpilih =
      null;


    fotoBase64 =
      null;


    document
      .getElementById(
        "searchInput"
      )
      .value =
      "";


    document
      .getElementById(
        "selectedBox"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "cameraSection"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "preview"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "preview"
      )
      .src =
      "";


    document
      .getElementById(
        "submitBtn"
      )
      .disabled =
      true;


    document
      .getElementById(
        "submitBtn"
      )
      .textContent =
      "✓ Absen";


    hideMessage();


    tampilkanPeserta(
      pesertaList
    );

  }


  // ==================================================
  // MESSAGE
  // ==================================================

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    message.className =
      "message " +
      type;


    message.style.display =
      "block";

  }


  function hideMessage() {

    const message =
      document.getElementById(
        "message"
      );


    message.style.display =
      "none";

  }


  // ==================================================
  // ESCAPE HTML
  // ==================================================

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }

</script>

</body>
</html>
